# Pole2 찬양팀 — 데이터베이스 자동 백업 (v20)
#  매주 일요일 새벽 3시 17분(한국 시간)에 Supabase 데이터를 통째로 내려받아 암호화한 뒤
#  이 저장소의 Actions › 'DB 백업' 실행 기록에 90일 동안 보관해요. 끝나면 사이트 설정 화면에 '마지막 백업'이 떠요.
#  필요한 Secrets (Settings › Secrets and variables › Actions):
#    SUPABASE_DB_URL    : Supabase › Connect › Session pooler 주소 (비밀번호 넣은 것)
#    BACKUP_PASSPHRASE  : 백업 파일 암호 (길게. 잃어버리면 백업을 못 열어요)
#  지금 바로 해 보기: Actions › DB 백업 › Run workflow
name: DB 백업

on:
  schedule:
    - cron: "17 18 * * 6"   # UTC 토 18:17 = 한국 일 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: pg_dump 17 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: 백업 · 암호화
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ] || [ -z "${PASS}" ]; then echo "::error::SUPABASE_DB_URL, BACKUP_PASSPHRASE Secrets를 먼저 넣어 주세요"; exit 1; fi
          BIN=/usr/lib/postgresql/17/bin
          D=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          mkdir -p out
          # 1) 앱 데이터 전체 (표 · 함수 · 권한 규칙 포함)
          $BIN/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --file="out/public-$D.dump"
          # 2) 로그인 계정 (팀원 계정을 되살릴 때 필요) — 데이터만
          $BIN/pg_dump "$DB_URL" --format=custom --data-only --table=auth.users --table=auth.identities --file="out/auth-$D.dump"
          # 내용 확인: 표 목록이 읽히는지 (파일로 받아서 확인 — 파이프로 grep -q 하면 Broken pipe로 실패)
          $BIN/pg_restore --list "out/public-$D.dump" > /tmp/list.txt
          grep "TABLE DATA public members" /tmp/list.txt
          tar -C out -cf "pole2-backup-$D.tar" .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "pole2-backup-$D.tar.gpg" "pole2-backup-$D.tar"
          rm -rf out "pole2-backup-$D.tar"
          echo "FILE=pole2-backup-$D.tar.gpg" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s pole2-backup-$D.tar.gpg)" >> "$GITHUB_ENV"

      - name: 보관 (90일)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90
          if-no-files-found: error

      - name: 사이트에 '마지막 백업' 남기기
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          SQL="insert into public.backup_log (ok, size_bytes, note) values (true, $SIZE, 'run $GITHUB_RUN_ID')"
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "$SQL"

      - name: 실패 기록
        if: failure()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          SQL="insert into public.backup_log (ok, note) values (false, 'run $GITHUB_RUN_ID failed')"
          if [ -n "$DB_URL" ]; then /usr/lib/postgresql/17/bin/psql "$DB_URL" -q -c "$SQL" || true; fi
