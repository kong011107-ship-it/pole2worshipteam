<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#410A85">
  <title>Pole2 찬양팀</title>
  <link rel="icon" href="assets/favicon.svg?v=17" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png?v=17" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png?v=17" sizes="16x16">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pole2 찬양팀">

<body>
  <div class="m-wrap">
    <header style="background: linear-gradient(150deg, var(--violet-hi) 0%, var(--violet) 75%); color: #fff; padding: 40px 24px 36px; display: flex; flex-direction: column; gap: 22px">
      <img src="assets/logo-white.png" alt="Pole2" style="height: 34px; align-self: flex-start">
      <div>
        <p class="small" style="margin: 0 0 6px; color: #DCCBF5; font-weight: 600" data-team-name></p>
        <h1 style="font-size: 28px; font-weight: 800; line-height: 1.3">함께 예배를 섬기는<br>찬양팀입니다</h1>
      </div>
    </header>
    <main class="m-main" style="padding-bottom: 40px">
      <a class="card bordered" href="apply.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px">
        <b style="font-size: 17px">찬양팀 지원하기</b>
        <span class="muted small">지원 → 면접 → 수습 5주 → 정식 전환. 지원서는 짧게 써도 괜찮아요.</span>
      </a>
      <a class="card bordered" href="login.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px">
        <b style="font-size: 17px">팀원 로그인</b>
        <span class="muted small">섬김 일정, 수습 진행 상황 확인</span>
      </a>
    </main>
  </div>
  <script src="assets/config.js?v=17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/common.js?v=17"></script>
