<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#410A85">
  <title>Pole2 찬양팀</title>
  <link rel="icon" href="assets/favicon.svg?v=17" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png?v=17" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png?v=17" sizes="16x16">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pole2 찬양팀">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=17">
  <link rel="stylesheet" href="assets/app.css?v=17">
</head>
<body>
<div class="m-wrap">
  <header class="topbar">
    <img src="assets/logo-violet.png" alt="Pole2">
    <span class="who"><span id="whoName"></span><span id="whoBadge"></span><a href="#alerts" class="bell" id="bell" aria-label="알림"></a></span>
  </header>

  <main class="m-main" id="view-home"></main>

  <main class="m-main hidden" id="view-respond"></main>
  <main class="m-main hidden" id="view-lineup"></main>
  <main class="m-main hidden" id="view-alerts"></main>
  <main class="m-main hidden" id="view-install"></main>
  <main class="m-main hidden" id="view-pray"></main>

  <main class="m-main hidden" id="view-info">
    <section class="card">
      <div class="card-head"><h2 class="card-title">내 포지션</h2></div>
      <dl class="kv" id="posInfo"></dl>
    </section>
    <section class="card" id="appCard">
      <div class="card-head"><h2 class="card-title">내 지원서와 서약</h2></div>
      <p class="muted small" style="margin: -4px 0 12px">지원할 때 작성한 내용이에요. 고칠 부분이 있으면 리더에게 말씀해 주세요.</p>
      <dl class="kv" id="appInfo" style="margin-bottom: 14px"></dl>
      <details open><summary style="cursor: pointer; font-weight: 700; color: var(--violet); margin-bottom: 8px" id="pledgeTitle"></summary>
        <div class="pledge-box" id="pledge"></div>
        <p class="muted small" id="pledgedAt" style="margin: 8px 0 0"></p>
      </details>
    </section>
    <section class="card" id="devCard"></section>
    <button type="button" class="btn btn-ghost" onclick="logout()">로그아웃</button>
  </main>
</div>

<nav class="tabbar" aria-label="하단 메뉴"><div class="tabbar-inner" id="tabbar"></div></nav>

<script src="assets/config.js?v=17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/common.js?v=17"></script>
<script>
  let ctx, me, app, extras = [], ST;

  (async function init() {
    ctx = await requireMember();
    if (!ctx) return;
    me = ctx.me;
    await loadPositions();
    ST = await loadSettings();
    $("#whoName").textContent = `${me.name}님`;
    $("#whoBadge").innerHTML = me.status === "trainee" ? `<span class="chip chip-violet">수습</span>`
      : me.role === "admin" ? `<a href="admin.html" class="switch-btn">관리자 화면</a>` : "";

    const [a, x] = await Promise.all([
      sb.from("applications").select("*").eq("user_id", me.id).maybeSingle(),
      sb.from("member_extra_positions").select("position_code").eq("member_id", me.id),
    ]);
    app = a.data; extras = x.data || [];

    PWA.register();
    renderTabbar();
    renderInfo();
    refreshBell();
    if (me.status === "trainee") {
      const { data: pps } = await sb.rpc("my_trainee_postpones");
      renderTraineeHome(pps || []);
      $("#view-home").insertAdjacentHTML("beforeend", (await voteBanners()) + (await homePrayLink()) + await meetingCard());
    } else await renderMemberHome();
    await appBanner();
    showView();
  })();

  // ---------- 탭 ----------
  function renderTabbar() {
    const tabs = me.status === "trainee"
      ? [["home", "홈", ICON.home], ["pray", "기도", ICON.pray], ["info", "내 정보", ICON.user]]
      : [["home", "홈", ICON.home], ["respond", "섬김 응답", ICON.check], ["lineup", "배치표", ICON.table], ["pray", "기도", ICON.pray], ["info", "내 정보", ICON.user]];
    $("#tabbar").innerHTML = tabs.map(([id, label, icon]) =>
      `<button type="button" data-tab="${id}">${icon}${label}</button>`).join("");
    $("#tabbar").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      go(b.dataset.tab);
    });
  }

  // ---------- 014: 뒤로가기 ----------
  //  메인 화면끼리 옮겨 다닐 때는 기록을 쌓지 않음: 기록은 늘 [홈] 또는 [홈, 지금 화면] 두 칸
  //  → 어느 화면에서든 뒤로가기 = 홈, 홈에서 뒤로가기 = 앱 종료
  const VIEWS = ["home", "respond", "lineup", "info", "alerts", "install", "pray"];
  const curView = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "home"; };
  // ---------- 015: 알림으로 바로 가기 (#respond/min:… · #lineup/2026-11-01 · #practice/… · #alerts/12 · #pray/3)
  //  주소 뒤쪽(항목)은 한 번만 쓰고, 기록에는 화면 이름만 남김 → 뒤로가기 규칙(014)은 그대로
  let deep = null;
  const DEEP_VIEWS = [...VIEWS, "practice"];
  function takeDeep() {
    const [v, ...rest] = location.hash.slice(1).split("/");
    if (!rest.length || !DEEP_VIEWS.includes(v)) return null;
    return { v, arg: decodeURIComponent(rest.join("/")) };
  }
  const deepBase = (d) => (d.v === "practice" ? "home" : d.v);
  const hit = (el, block = "center") => { if (!el) return; el.scrollIntoView({ block }); el.classList.remove("deep-hit"); void el.offsetWidth; el.classList.add("deep-hit"); };
  const deepNote = (v, text) => v.insertAdjacentHTML("afterbegin", `<div class="notice ok deep-note">${text}</div>`);
  function go(v) {
    if (!VIEWS.includes(v)) v = "home";
    const cur = curView();
    if (v === cur) return showView();
    if (v === "home") {
      if (history.state?.lv === 1) return history.back();   // hashchange → showView
      history.replaceState({ lv: 0 }, "", "#home"); return showView();
    }
    if (cur === "home") history.pushState({ lv: 1 }, "", "#" + v);
    else history.replaceState({ lv: 1 }, "", "#" + v);
    showView();
  }
  // 처음 열 때(알림을 눌러 바로 응답 화면으로 온 경우 등) 홈을 아래에 깔아 둠
  deep = takeDeep();
  if (!(history.state && "lv" in history.state)) {
    const first = deep ? deepBase(deep) : curView();
    history.replaceState({ lv: 0 }, "", "#home");
    if (first !== "home") history.pushState({ lv: 1 }, "", "#" + first);
  } else if (deep) history.replaceState({ lv: deepBase(deep) === "home" ? 0 : 1 }, "", "#" + deepBase(deep));
  // 화면 안 링크(#respond, #install, 종 …)도 같은 규칙으로
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    const [v, ...rest] = a.getAttribute("href").slice(1).split("/");
    if (rest.length && DEEP_VIEWS.includes(v)) deep = { v, arg: decodeURIComponent(rest.join("/")) };
    go(v);
  });
  function showView() {
    if (!me) return;   // 아직 불러오는 중이면 init이 끝난 뒤 다시 호출됨
    const allowed = me.status === "trainee" ? ["home", "info", "alerts", "install", "pray"] : ["home", "respond", "lineup", "info", "alerts", "install", "pray"];
    const h = location.hash.slice(1);
    const v = allowed.includes(h) ? h : "home";
    if (deep?.v === "practice") return void resolvePractice();
    VIEWS.forEach((k) => $(`#view-${k}`).classList.toggle("hidden", v !== k));
    $$("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === v));
    $("#bell").classList.toggle("on", v === "alerts");
    if (v === "respond") renderRespond();
    if (v === "lineup") renderLineup();
    if (v === "alerts") renderAlerts();
    if (v === "install") renderInstall();
    if (v === "pray") renderPray();
    if (v === "info") renderDevCard($("#devCard"));
    if (v === "home" && deep?.v === "home") deep = null;
    if (v === "home") refreshVoteBanners();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => {
    const d = takeDeep();   // 앱이 열려 있을 때 알림을 누른 경우
    if (d) { deep = d; history.replaceState({ lv: deepBase(d) === "home" ? 0 : 1 }, "", "#" + deepBase(d)); }
    showView();
  });

  // 연습 확정 알림: 정해진 연습이고 아직 답할 수 있으면 그 칸으로, 아니면 홈 맨 위에 연습 카드
  async function resolvePractice() {
    const id = deep.arg; deep = null;
    const [D, pr] = await Promise.all([loadMinistries(), sb.from("ministry_practices").select("*, ministries(name, practice_mode, response_mode), services(label)").eq("id", id).maybeSingle()]);
    const p = pr.data;
    const mi = p && D.list.find((x) => x.id === p.ministry_id);
    if (mi && fixedAsk(D, mi).some((x) => x.id === id)) {
      const months = await openMonths();
      const key = mi.response_mode === "separate" ? (mi.response_open ? `min:${mi.id}` : null)
        : (months.find((m) => mi.svs.some((s) => monthOf(s.service_date) === m.month))?.month ? `month:${months.find((m) => mi.svs.some((s) => monthOf(s.service_date) === m.month)).month}` : null);
      if (key) { deep = { v: "respond", arg: key, pid: id }; return go("respond"); }
    }
    if (location.hash !== "#home") { go("home"); }
    VIEWS.forEach((k) => $(`#view-${k}`).classList.toggle("hidden", k !== "home"));
    $$("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === "home"));
    $("#practiceCard")?.remove();
    if (!p) { toast("연습 일정을 찾을 수 없어요. 바뀌었을 수 있어요", 3500); return; }
    const ans = D.pa.find((a) => a.practice_id === id)?.available;
    $("#view-home").insertAdjacentHTML("afterbegin", `<section class="card bordered" id="practiceCard" style="display:flex;flex-direction:column;gap:6px;border-color:var(--violet-soft)">
      <span class="muted small">확정된 연습</span>
      <b style="font-size:18px">${esc(p.ministries?.name || "사역")}${p.services?.label ? " · " + esc(p.services.label) : ""}</b>
      <span style="font-weight:600">${fmtDate(p.practice_date, { month: "long", day: "numeric", weekday: "short" })} ${timeRange(p.start_time, p.end_time)}</span>
      ${ans === undefined ? "" : `<span class="chip ${ans ? "chip-ok" : "chip-gray"}" style="align-self:flex-start">내 답 · ${ans ? "가능" : "불가"}</span>`}</section>`);
    window.scrollTo(0, 0);
    hit($("#practiceCard"), "start");
  }

  // ---------- 이번 주 팀모임 + 최근 출석 ----------
  // 016: 팀모임 불참 미리 알리기 — 팀모임 '있음'인 토요일 낮 12시까지, 사유 필수
  let preForm = null;   // { tag, text }
  const preUntil = (sat) => new Date(`${sat}T12:00:00+09:00`);
  async function meetingCard() {
    const sat = upcomingSaturday();
    const [tm, at] = await Promise.all([
      sb.from("team_meetings").select("meeting_date, meeting_status").eq("meeting_date", sat).maybeSingle(),
      sb.from("attendance").select("status, kind, reason_tag, reason, self_reported_at, team_meetings(meeting_date, meeting_status)").eq("member_id", me.id).eq("kind", "meeting"),
    ]);
    const ms = tm.data?.meeting_status || "tbd";
    const chip = { yes: "chip-ok", no: "chip-gray", tbd: "chip-mid" }[ms];
    const sub = { yes: "토요 연습 후 함께 모여요", no: "이번 주는 팀모임이 없어요", tbd: "정해지면 여기에 보여요" }[ms];
    const today = todayISO();
    const mine = (at.data || []).find((r) => r.team_meetings?.meeting_date === sat);
    const open = Date.now() < preUntil(sat).getTime();
    const why = (r) => [r?.reason_tag, r?.reason].filter(Boolean).join(" · ");
    let pre = "";
    if (ms === "yes" && mine?.self_reported_at) {
      pre = `<div class="prerep on"><span><b>불참으로 알렸어요</b><span class="small">${esc(why(mine))}${open ? ` · ${md(sat)} 낮 12시까지 바꿀 수 있어요` : ""}</span></span>
        ${open ? `<button type="button" class="btn btn-ghost btn-sm" data-pre="cancel">참석으로 바꾸기</button>` : ""}</div>`;
    } else if (ms === "yes" && !mine && open) {
      pre = preForm ? `<div class="prerep-form" role="group" aria-label="팀모임 불참 알리기">
          <b style="font-size:15px">못 오는 이유를 알려 주세요</b>
          <div class="chips2" data-pre-tags>${REASON_TAGS.map((t) => `<button type="button" data-tag="${t}" aria-pressed="${preForm.tag === t}">${t}</button>`).join("")}</div>
          <input type="text" class="input" data-pre-text maxlength="200" value="${esc(preForm.text)}" placeholder="직접 적기 (칩 없이 적어도 돼요)">
          <span class="small muted">리더십에게만 보여요. 출석에는 결석(미리 알림)으로 들어가요.</span>
          <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-pre="close">취소</button><button type="button" class="btn btn-primary btn-sm" data-pre="send">불참 알리기</button></div></div>`
        : `<div class="prerep"><span class="small muted">못 오게 되면 미리 알려 주세요 · ${md(sat)} 낮 12시까지</span><button type="button" class="btn btn-soft btn-sm" data-pre="open">불참 알리기</button></div>`;
    }
    const recs = (at.data || []).filter((r) => r.team_meetings && r.team_meetings.meeting_status === "yes" && !(r.self_reported_at && r.team_meetings.meeting_date >= today))
      .sort((a, b) => b.team_meetings.meeting_date.localeCompare(a.team_meetings.meeting_date)).slice(0, 5).reverse();
    const attended = recs.filter((r) => r.status === "present" || r.status === "late").length;
    const color = (s) => s === "present" ? "var(--violet)" : s === "late" ? "#D9A066" : s === "excused" ? "#C3BACF" : "#D8D2E3";
    return `<section class="card" id="meetCard" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">이번 주 팀모임 · ${fmtDate(sat, { month: "long", day: "numeric", weekday: "short" })}</span>
          <b style="font-size:17px">${sub}</b></span>
        <span class="chip ${chip}" style="font-size:14px;padding:6px 12px;border-radius:999px">${MEETING[ms]}</span>
      </div>${pre}
      ${recs.length ? `<div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">최근 팀모임 출석</span><b>${recs.length}번 중 ${attended}번</b></span>
        <span style="display:flex;gap:6px" role="img" aria-label="최근 ${recs.length}번 중 ${attended}번 출석">${recs.map((r) =>
          `<span title="${fmtDate(r.team_meetings.meeting_date)} ${ATT[r.status]}" style="width:10px;height:10px;border-radius:999px;background:${color(r.status)}"></span>`).join("")}</span></div>` : ""}
    </section>`;
  }

  async function redrawMeet() { const el = $("#meetCard"); if (el) el.outerHTML = await meetingCard(); }
  document.addEventListener("click", async (e) => {
    const card = e.target.closest("#meetCard"); if (!card) return;
    const tag = e.target.closest("[data-pre-tags] [data-tag]");
    if (tag && preForm) { preForm.text = card.querySelector("[data-pre-text]").value; preForm.tag = preForm.tag === tag.dataset.tag ? null : tag.dataset.tag;
      card.querySelectorAll("[data-pre-tags] [data-tag]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tag === preForm.tag))); return; }
    const b = e.target.closest("[data-pre]"); if (!b) return;
    const sat = upcomingSaturday(), act = b.dataset.pre;
    if (act === "open") { preForm = { tag: null, text: "" }; await redrawMeet(); return $("#meetCard [data-pre-tags] button")?.focus(); }
    if (act === "close") { preForm = null; return redrawMeet(); }
    if (act === "send") {
      const text = card.querySelector("[data-pre-text]").value.trim();
      if (!preForm.tag && !text) return toast("불참 사유를 고르거나 적어 주세요");
      b.disabled = true;
      const { error } = await sb.rpc("report_meeting_absence", { p_date: sat, p_tag: preForm.tag, p_reason: text || null });
      if (error) { b.disabled = false; toast(error.message || "알리지 못했어요", 4000); return redrawMeet(); }
      preForm = null; toast("리더십에게 불참을 알렸어요"); return redrawMeet();
    }
    if (act === "cancel") {
      if (!confirm("불참 알림을 취소하고 참석으로 바꿀까요?")) return;
      const { error } = await sb.rpc("cancel_meeting_absence", { p_date: sat });
      toast(error ? error.message || "바꾸지 못했어요" : "참석으로 바꿨어요", 3500); return redrawMeet();
    }
  });
  document.addEventListener("input", (e) => { if (preForm && e.target.matches("#meetCard [data-pre-text]")) preForm.text = e.target.value; });

  // ---------- 016: 투표 (공지에 붙은 투표) ----------
  const dlHour = (iso) => { const k = new Date(Date.parse(iso) + 9 * 3600e3), h = k.getUTCHours(), mi = k.getUTCMinutes();
    return `${mdw(k.toISOString().slice(0, 10))} ${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${mi ? " " + mi + "분" : ""}`; };
  const voteState = {};   // id → poll_view
  async function voteBanners() {
    const { data, error } = await sb.rpc("poll_views", { p_ids: null });
    if (error) return "";
    (data || []).forEach((p) => (voteState[p.id] = p));
    const todo = (data || []).filter((p) => !p.ended && p.eligible && !p.my.length).sort((a, b) => a.deadline.localeCompare(b.deadline));
    return `<div id="voteBanners" style="display:contents">${todo.map((p) => `<a class="notice-link vote-link" href="#alerts/${p.notification_id}">
        <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="small" style="font-weight:800;color:var(--violet)">투표에 참여해 주세요</span><b>${esc(p.question)}</b><span class="muted small">${dlHour(p.deadline)} 마감 · ${p.voters}/${p.targets}명 참여</span></span>
        <span class="chip chip-solid" style="border-radius:999px;padding:6px 12px">투표</span></a>`).join("")}</div>`;
  }
  // 홈으로 돌아오면 투표 배너를 다시 (다른 화면에서 투표했을 수 있음)
  async function refreshVoteBanners() { const el = $("#voteBanners"); if (el) el.outerHTML = await voteBanners(); }
  function voteCard(p) {
    const mine = new Set(p.my);
    if (p.ended) {
      const max = Math.max(1, ...p.options.map((o) => o.count || 0));
      return `<section class="vote ended" data-poll="${p.id}"><div class="vhd"><span class="ktag vtag">투표 결과</span><b>${esc(p.question)}</b></div>
        <span class="small muted">${p.closed_at && Date.parse(p.closed_at) < Date.parse(p.deadline) ? "리더가 일찍 마감했어요" : dlHour(p.deadline) + " 마감"} · ${p.voters}/${p.targets}명 참여${p.anonymous ? " · 익명" : ""}</span>
        <div class="vres">${p.options.map((o) => `<div class="vrow ${mine.has(o.id) ? "mine" : ""} ${o.count === max && o.count ? "top" : ""}"><span class="vl">${esc(o.label)}${mine.has(o.id) ? ` <span class="chip chip-violet">내 선택</span>` : ""}</span>
          <span class="vbar"><i style="width:${o.count ? Math.max(4, Math.round(100 * o.count / max)) : 0}%"></i></span><b>${o.count ?? 0}</b>
          ${!p.anonymous && o.names?.length ? `<span class="vn small muted">${o.names.map(esc).join(", ")}</span>` : ""}</div>`).join("")}</div>
        ${!p.my.length ? `<span class="small muted">이 투표에는 참여하지 않았어요.</span>` : ""}</section>`;
    }
    return `<section class="vote" data-poll="${p.id}"><div class="vhd"><span class="ktag vtag">투표</span><b>${esc(p.question)}</b></div>
      <span class="small muted">${p.multi ? "여러 개 고를 수 있어요" : "하나만 골라요"}${p.anonymous ? " · 익명" : ""} · ${dlHour(p.deadline)} 마감 · ${p.voters}/${p.targets}명 참여</span>
      <div class="vchoices" role="group" aria-label="${esc(p.question)}">${p.options.map((o) => `<button type="button" class="vchoice ${p.multi ? "multi" : ""}" data-opt="${o.id}" aria-pressed="${mine.has(o.id)}"><i aria-hidden="true"></i><span>${esc(o.label)}</span></button>`).join("")}</div>
      <span class="small ${p.my.length ? "vsaved" : "muted"}">${p.my.length ? "투표했어요 · 마감 전까지 바꿀 수 있어요" : "누르면 바로 저장돼요"} · 결과는 마감 뒤에 공개돼요</span></section>`;
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest(".vote .vchoice"); if (!b || b.disabled) return;
    const box = b.closest(".vote"), id = +box.dataset.poll, p = voteState[id]; if (!p) return;
    const opt = +b.dataset.opt, cur = new Set(p.my);
    let next;
    if (p.multi) { cur.has(opt) ? cur.delete(opt) : cur.add(opt); next = [...cur]; }
    else next = cur.has(opt) && cur.size === 1 ? [] : [opt];
    box.querySelectorAll(".vchoice").forEach((x) => (x.disabled = true));
    const { data, error } = await sb.rpc("vote", { p_poll: id, p_options: next });
    if (error) {
      toast(error.message || "저장하지 못했어요", 3500);
      const r = await sb.rpc("poll_view", { p_poll: id }); if (r.data) { voteState[id] = r.data; box.outerHTML = voteCard(r.data); }
      return;
    }
    voteState[id] = data; box.outerHTML = voteCard(data);
    toast(next.length ? "투표했어요" : "투표를 취소했어요");
  });

  // ---------- 수습생 홈 ----------
  function renderTraineeHome(pps) {
    const start = app?.trainee_start;
    const st = traineeState(start, pps), w = st.week;
    const cur = TRAINEE_WEEKS[Math.min(Math.max(w, 1), 5) - 1];
    let hero;
    if (!start || w === 0) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">수습을 곧 시작해요</span>
        <span class="sub">${start ? fmtDate(st.resume, { weekday: "short" }) + " 토요 연습부터 함께해요." : "시작일은 리더가 안내해 드려요."}</span>`;
    } else if (st.paused) {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차까지 완료</b></div>
        <span class="big">${st.nextWeek}주차가 미뤄졌어요</span>
        <span class="sub">${fmtDate(st.resume, { month: "long", day: "numeric", weekday: "short" })} 토요 연습부터 다시 함께해요.</span>
        <div class="weekbar" aria-label="5주 중 ${w}주 완료">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    } else if (w > 5) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">5주 과정을 마쳤어요</span>
        <span class="sub">리더십과 커피챗 후 정식 전환을 안내해 드려요.</span>`;
    } else {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차 / 5주</b></div>
        <span class="big">${esc(cur.title)}</span>
        <span class="sub">${esc(cur.desc)}</span>
        <div class="weekbar" aria-label="5주 중 ${w}주차">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    }

    let schedule = "";
    if (start && w >= 0 && w <= 5) {
      const n = st.paused ? st.nextWeek : Math.max(w, 1);
      const sat = traineeWeekSat(start, n, pps), sun = addDays(sat, 1);
      schedule = `<section class="card" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="card-title">${w === 0 ? "첫 주 일정" : st.paused ? `다시 시작하는 ${n}주차 일정` : "이번 주 일정"}</h2>
        ${row(md(sat), "토", `토요 팀 연습 · ${hm(ST.sat_practice_start)}`, n >= 3 ? TRAINEE_WEEKS[n - 1].desc : "연습을 함께 지켜보며 팀 문화에 적응해요")}
        ${row(md(sun), "주일", "오전 9시 세팅 참관", "예배 후 리더십과 나눔")}
      </section>`;
    }
    function row(d, day, t, s) {
      return `<div style="display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start">
        <span class="small" style="font-weight:700;color:var(--violet);background:var(--tint);border-radius:8px;padding:6px 0;text-align:center">${d}<br>${day}</span>
        <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(t)}</b><span class="muted small">${esc(s)}</span></span></div>`;
    }

    const steps = [[1, "1~2주", "참관 + 적응"], [3, "3주", "부담 적은 투입"], [4, "4주", "실전 연주 · 지정곡 1곡"], [5, "5주", "전환 면접 · 리더십과 커피챗"]];
    const list = steps.map(([n, r, t]) => {
      const end = n === 1 ? 2 : n;
      const state = w > end ? "done" : w >= n ? "now" : "todo";
      const mark = state === "done"
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--violet-mid)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
        : state === "now" ? `<span role="img" aria-label="진행 중" style="width:12px;height:12px;border-radius:999px;background:var(--violet);margin-left:3px"></span>`
        : `<span style="width:12px;height:12px;border-radius:999px;border:2px solid var(--violet-soft);margin-left:3px"></span>`;
      return `<li style="display:grid;grid-template-columns:22px 54px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;${state === "done" ? "color:var(--faint)" : ""}">
        ${mark}<span class="small" style="font-weight:${state === "now" ? 700 : 600};color:${state === "now" ? "var(--violet)" : "var(--muted-2)"}">${r}</span>
        <span style="font-weight:${state === "now" ? 700 : 400}">${esc(t)}</span></li>`;
    }).join("");

    $("#view-home").innerHTML = `<section class="hero">${hero}</section>${schedule}
      <section class="card"><h2 class="card-title" style="margin-bottom:6px">수습 5주 과정</h2>
        <ol style="list-style:none;margin:0;padding:0">${list}</ol></section>`;
  }

  // ---------- 섬김 (주일 · 사역) 공용 ----------
  // 공개 배치를 예배 단위로 묶음
  const groupLineup = (rows) => {
    const by = new Map();
    rows.forEach((r) => { const k = r.service_id || r.service_date; if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
    return [...by.values()].sort((a, b) => a[0].service_date.localeCompare(b[0].service_date) || hm(a[0].start_time).localeCompare(hm(b[0].start_time)));
  };
  const svcTitle = (r, multi) => r.ministry_id ? `${r.ministry_name}${multi && r.label ? " · " + r.label : ""}` : "주일";
  const svcTime = (r) => r.ministry_id ? timeRange(r.start_time, r.end_time) : timeRange(...sunTime(r, ST));
  async function satRows(sundays) {
    if (!sundays.length) return [];
    const { data } = await sb.from("team_meetings").select("meeting_date, practice_start, practice_end").in("meeting_date", sundays.map((d) => addDays(d, -1)));
    return data || [];
  }

  // ---------- 멤버 홈 ----------
  async function renderMemberHome() {
    const today = todayISO();
    const monthStart = today.slice(0, 8) + "01";
    const [lu, meet, banners, prs] = await Promise.all([
      sb.from("published_lineups").select("*").gte("service_date", monthStart).order("service_date"),
      meetingCard(),
      respondBanners(),
      sb.from("ministry_practices").select("ministry_id, service_id, practice_date, start_time, end_time").gte("practice_date", today).order("practice_date"),
    ]);
    const rows = lu.data || [];
    const mine = rows.filter((r) => r.member_id === me.id);
    const roleChip = (r) => r.is_singer_leader ? "싱어 리더" : r.is_band_master ? "밴드 마스터" : "";
    const groups = groupLineup(rows);
    const multiOf = (r) => groups.filter((g) => g[0].ministry_id && g[0].ministry_id === r.ministry_id).length > 1;
    const sats = await satRows([...new Set(mine.filter((r) => !r.ministry_id).map((r) => r.service_date))]);

    const next = mine.find((r) => r.service_date >= today);
    let hero;
    if (next) {
      const same = rows.filter((r) => (r.service_id || r.service_date) === (next.service_id || next.service_date));
      const lead = same.find((r) => r.position_code === "leader");
      const bm = same.find((r) => r.is_band_master);
      const role = roleChip(next);
      const pills = [];
      if (next.ministry_id) {
        const p = (prs.data || []).find((x) => x.ministry_id === next.ministry_id && x.service_id === next.service_id)
          || (prs.data || []).find((x) => x.ministry_id === next.ministry_id && !x.service_id);
        if (p) pills.push(`연습 ${mdw(p.practice_date)} ${hm(p.start_time)}`);
      } else {
        const sat = addDays(next.service_date, -1), sr = sats.find((x) => x.meeting_date === sat);
        pills.push(`토요 연습 ${md(sat)} ${hm(satTime(sr, ST)[0])}`);
      }
      if (lead || bm) pills.push([lead && "인도 " + esc(lead.member_name), bm && "밴마 " + esc(bm.member_name)].filter(Boolean).join(" · "));
      hero = `<section class="hero"><p class="eyebrow">${next.service_date <= addDays(today, 7) ? "이번 주" : "다음"} 나의 섬김</p>
        <div style="display:flex;flex-direction:column;gap:4px"><span class="big">${fmtDate(next.service_date, { month: "long", day: "numeric" })} ${esc(svcTitle(next, multiOf(next)))}</span>
          <span style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600">${esc(next.position_name)} · ${svcTime(next)}
            ${role ? `<span class="chip" style="background:#fff;color:var(--violet)">${role}</span>` : ""}</span></div>
        <div class="pills">${pills.map((p) => `<span>${p}</span>`).join("")}</div></section>`;
    } else {
      hero = `<section class="card bordered"><b style="font-size:17px">다가오는 섬김이 아직 없어요</b>
        <p class="muted small" style="margin:4px 0 0">배치표가 확정되면 여기에 보여요.</p></section>`;
    }

    const thisMonth = mine.filter((r) => r.service_date.slice(0, 7) === today.slice(0, 7));
    const monthCard = `<section class="card"><div class="card-head"><h2 class="card-title">${+today.slice(5, 7)}월 섬김 일정</h2></div>
      ${thisMonth.length ? thisMonth.map((r) => { const on = r === next; return `<div style="display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F1EAFB">
          <b style="color:${on ? "var(--violet)" : "var(--muted)"}">${md(r.service_date)}</b>
          <span style="font-weight:${on ? 700 : 400}">${r.ministry_id ? `<span class="chip chip-violet" style="margin-right:4px">${esc(svcTitle(r, multiOf(r)))}</span>` : ""}${esc(r.position_name)}</span>
          ${roleChip(r) ? `<span class="chip chip-violet">${roleChip(r)}</span>` : "<span></span>"}</div>`; }).join("")
        : `<p class="muted small" style="margin:0">이번 달 확정된 배치가 아직 없어요.</p>`}</section>`;

    $("#view-home").innerHTML = banners + (await voteBanners()) + hero + (await homePrayLink()) + meet + monthCard;
  }

  // ---------- 섬김 응답: 데이터 ----------
  async function openMonths() {
    const { data } = await sb.from("availability_months").select("*").eq("is_open", true)
      .gte("month", monthOf(todayISO())).order("month");
    return data || [];
  }
  function slotsOf(month) {
    return sundaysOf(month).flatMap((sun) => [
      { date: addDays(sun, -1), kind: "sat_practice", sun },
      { date: sun, kind: "sunday", sun },
    ]);
  }
  async function myAnswers(month) {
    const slots = slotsOf(month);
    const { data } = await sb.from("availability").select("date, kind, available").eq("member_id", me.id)
      .gte("date", slots[0].date).lte("date", slots[slots.length - 1].date);
    return data || [];
  }
  // 사역: 나에게 해당하는 것만 (대상 · 아직 지나지 않은 것)
  async function loadMinistries() {
    const today = todayISO();
    const [mi, tg, av, pa, po] = await Promise.all([
      sb.from("ministries").select("*, services(id, service_date, label, start_time, end_time, sort_order), ministry_practices(*)"),
      sb.from("ministry_targets").select("ministry_id").eq("member_id", me.id),
      sb.from("ministry_availability").select("service_id, available").eq("member_id", me.id),
      sb.from("practice_answers").select("practice_id, available").eq("member_id", me.id),
      sb.from("ministry_poll").select("ministry_id, slots").eq("member_id", me.id),
    ]);
    if (mi.error) return { list: [], av: [], pa: [], po: [] };
    const mine = new Set((tg.data || []).map((t) => t.ministry_id));
    const list = (mi.data || []).filter((m) => (m.target_mode === "all" || mine.has(m.id)) && m.services.some((s) => s.service_date >= today))
      .map((m) => ({ ...m, svs: m.services.slice().sort((a, b) => a.service_date.localeCompare(b.service_date) || a.sort_order - b.sort_order),
        prs: m.ministry_practices.slice().sort((a, b) => a.practice_date.localeCompare(b.practice_date)) }));
    return { list, av: av.data || [], pa: pa.data || [], po: po.data || [] };
  }
  const myAvail = (D, sid) => D.av.find((a) => a.service_id === sid)?.available;
  const myPract = (D, pid) => D.pa.find((a) => a.practice_id === pid)?.available;
  const pollable = (D, m) => m.practice_mode === "poll" && m.poll_open && m.svs.some((s) => myAvail(D, s.id) === true);
  // 정해진 연습 중 지금 물어볼 것: 본 섬김이 '가능'인 예배의 연습만 (불가로 바꾸면 숨김 · 답은 남겨 둠)
  const fixedAsk = (D, m) => m.practice_mode === "fixed" ? m.prs.filter((p) => p.practice_date >= todayISO()
    && (p.service_id ? myAvail(D, p.service_id) === true : m.svs.some((s) => myAvail(D, s.id) === true))) : [];
  // 사역 한 개에서 내가 답할 칸 수 / 답한 칸 수 (예배 + 정해진 연습)
  const minCount = (D, m) => {
    const fixed = fixedAsk(D, m);
    const total = m.svs.length + fixed.length;
    const done = m.svs.filter((s) => myAvail(D, s.id) !== undefined).length + fixed.filter((p) => myPract(D, p.id) !== undefined).length;
    return { total, done };
  };

  async function respondBanners() {
    const [months, D] = await Promise.all([openMonths(), loadMinistries()]);
    const out = [];
    for (const m of months) {
      const mins = D.list.filter((x) => x.response_mode === "monthly" && x.svs.some((s) => monthOf(s.service_date) === m.month));
      const total = slotsOf(m.month).length + mins.reduce((n, x) => n + minCount(D, x).total, 0);
      const done = (await myAnswers(m.month)).length + mins.reduce((n, x) => n + minCount(D, x).done, 0);
      if (done < total) out.push(banner(`${monthLabel(m.month)} 섬김 응답을 받고 있어요`, `${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}${done ? `${total - done}개 남았어요` : "아직 응답 전"}`, m.deadline, `month:${m.month}`));
    }
    D.list.filter((x) => x.response_mode === "separate" && x.response_open).forEach((x) => {
      const c = minCount(D, x);
      if (c.done < c.total) out.push(banner(`${x.name} 섬김 응답`, `${x.response_deadline ? fmtDate(x.response_deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}${x.svs.length > 1 ? `예배 ${x.svs.length}개` : mdw(x.svs[0].service_date)}`, x.response_deadline, `min:${x.id}`));
    });
    const todoPoll = D.list.filter((x) => pollable(D, x) && !D.po.some((p) => p.ministry_id === x.id));
    if (todoPoll.length) {
      const dl = todoPoll.map((x) => x.poll_deadline).filter(Boolean).sort()[0];
      out.push(banner(`${todoPoll.map((x) => x.name).join(" · ")} 연습 시간을 골라 주세요`, `${dl ? fmtDate(dl, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}되는 칸을 눌러 고르기`, dl, "poll:all"));
    }
    return out.join("");
    function banner(t, sub, dl, key) {
      return `<a class="notice-link" href="#respond" onclick="respondKey='${key}'">
        <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(t)}</b><span class="muted small">${sub}</span></span>
        ${dl ? `<span class="chip chip-solid" style="border-radius:999px;padding:6px 12px">${dday(dl)}</span>` : ""}</a>`;
    }
  }

  // ---------- 섬김 응답 화면 ----------
  var respondKey = null;
  const paints = {};   // 연습 시간 칠하기 상태 (사역 묶음별)
  async function renderRespond() {
    const v = $("#view-respond");
    const dp = deep?.v === "respond" ? deep : null;
    if (dp) { deep = null; respondKey = dp.arg.startsWith("poll:") ? "poll:all" : dp.arg; }
    const [months, D] = await Promise.all([openMonths(), loadMinistries()]);
    const items = [
      ...months.map((m) => ({ key: `month:${m.month}`, title: `${monthLabel(m.month)} 섬김`, sub: m.deadline ? `${md(m.deadline)}까지` : "응답 받는 중" })),
      ...D.list.filter((x) => x.response_mode === "separate" && x.response_open).map((x) => ({ key: `min:${x.id}`, title: x.name, sub: x.response_deadline ? `${md(x.response_deadline)}까지` : "섬김 응답" })),
      ...(D.list.some((x) => pollable(D, x)) ? [{ key: "poll:all", title: "연습 시간", sub: `${D.list.filter((x) => pollable(D, x)).length}개 사역` }] : []),
    ];
    if (!items.length) {
      v.innerHTML = `<h1 style="font-size:22px;font-weight:800">섬김 응답</h1>
        <div class="empty">지금은 응답 받는 일정이 없어요.<br>리더가 응답을 열면 여기에 보여요.</div>`;
      if (dp) deepNote(v, "알림의 응답은 이미 마감됐어요.");
      return;
    }
    const gone = dp && !items.some((i) => i.key === respondKey);
    if (!items.some((i) => i.key === respondKey)) respondKey = items[0].key;
    const pick = items.length > 1 ? `<div class="resp-pick" id="respPick">${items.map((i) => `<button type="button" data-key="${i.key}" aria-pressed="${i.key === respondKey}"><b>${esc(i.title)}</b><span>${esc(i.sub)}</span></button>`).join("")}</div>` : "";
    const [kind, id] = respondKey.split(":");
    if (kind === "month") await drawMonth(v, months.find((m) => m.month === id), D, pick);
    if (kind === "min") drawMinistry(v, D.list.find((x) => x.id === id), D, pick);
    if (kind === "poll") drawPoll(v, D, pick);
    $("#respPick")?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { respondKey = b.dataset.key; renderRespond(); } });
    if (dp) focusRespond(v, dp, gone);
  }
  // 알림으로 들어왔을 때: 아직 안 한 첫 칸으로. 다 했으면 '이미 응답했어요'
  function focusRespond(v, dp, gone) {
    if (gone) return deepNote(v, "알림의 응답은 마감됐거나 대상이 아니에요. 지금 받는 응답을 보여 드려요.");
    if (dp.pid) { const r = v.querySelector(`[data-pid="${dp.pid}"]`); if (r) return hit(r); }
    if (respondKey === "poll:all") {
      const anyPicked = !!v.querySelector('.c[aria-pressed="true"]');
      if (anyPicked) { deepNote(v, "이미 연습 시간을 골랐어요. 바꾸고 싶으면 칸을 다시 눌러 주세요."); return window.scrollTo(0, 0); }
      return hit(v.querySelector("[data-pwrap]"), "start");
    }
    const rows = $$(".ans-row", v).filter((r) => r.offsetParent);
    const todo = rows.find((r) => !r.querySelector('[aria-pressed="true"]'));
    if (todo) return hit(todo);
    const poll = v.querySelector("[data-poll-inline] [data-pwrap]");
    if (poll && !poll.querySelector('.c[aria-pressed="true"]')) return hit(poll, "start");
    deepNote(v, "이미 모두 응답했어요. 바꾸고 싶으면 다시 눌러 주세요.");
    window.scrollTo(0, 0);
  }

  // 가능/불가 한 줄
  const ansRow = (attrs, title, sub, x) => `<div class="ans-row ansrow" ${attrs}>
      <span style="display:flex;flex-direction:column"><b>${title}</b><span class="muted small">${sub}</span></span>
      <button type="button" class="ans" data-v="true" aria-pressed="${x === true}">가능</button>
      <button type="button" class="ans" data-v="false" aria-pressed="${x === false}">불가</button></div>`;
  // 사역 예배·연습 줄
  //  본 섬김 '가능'을 누르면 바로 아래에 연습(정해진 연습 가능 여부 · 연습 시간 칠하기)이 펼쳐짐
  const minRows = (D, m) => {
    const fixed = fixedAsk(D, m);
    const poll = pollable(D, m);
    const unlock = m.svs.map((s) => s.id).join(" ");
    return `${m.svs.map((s) => ansRow(`data-sid="${s.id}"`, esc(m.svs.length > 1 ? s.label || m.name : m.name),
      `${fmtDate(s.service_date, { month: "long", day: "numeric", weekday: "short" })} ${timeRange(s.start_time, s.end_time)}`, myAvail(D, s.id))).join("")}
    ${fixed.length ? `<div class="prac-in" data-prac-for="${unlock}"><span class="small muted" style="font-weight:700">연습도 가능한지 알려 주세요</span>
      ${fixed.map((p) => ansRow(`data-pid="${p.id}"`, m.svs.length > 1 && p.service_id ? `${esc(m.svs.find((s) => s.id === p.service_id)?.label || "")} 연습` : "사전 연습",
        `${fmtDate(p.practice_date, { month: "long", day: "numeric", weekday: "short" })} ${timeRange(p.start_time, p.end_time)}`, myPract(D, p.id))).join("")}</div>` : ""}
    ${poll ? `<div class="poll-in" data-prac-for="${unlock}" data-poll-inline="${m.id}"></div>` : ""}`;
  };
  // 화면 안 '연습 시간 고르기' 칸 그리기
  const mountPollInline = (v, D) => $$("[data-poll-inline]", v).forEach((el) => drawPoll(el, D, "", [el.dataset.pollInline]));
  const progress = (done, total) => `<div style="display:flex;justify-content:space-between;align-items:baseline" class="prog-head"><span></span>
      <b class="small" style="color:var(--violet)" id="progLabel">${done} / ${total} 응답</b></div>
    <div style="height:6px;border-radius:999px;background:var(--tint-2);overflow:hidden"><div id="progBar" style="height:6px;border-radius:999px;background:var(--violet);width:${total ? Math.round(done / total * 100) : 0}%"></div></div>`;

  async function bindAnswers(v, total, monthSave) {
    const refresh = () => {
      const n = $$(".ans-row", v).filter((r) => r.querySelector('[aria-pressed="true"]')).length;
      $("#progLabel").textContent = `${n} / ${total} 응답`;
      $("#progBar").style.width = Math.round(n / total * 100) + "%";
      if (n === total) toast("모두 응답했어요");
    };
    v.querySelectorAll(".ans-row").forEach((row) => row.addEventListener("click", async (e) => {
      const b = e.target.closest(".ans"); if (!b) return;
      const val = b.dataset.v === "true";
      let error;
      if (row.dataset.sid) ({ error } = await sb.from("ministry_availability").upsert({ service_id: row.dataset.sid, member_id: me.id, available: val }));
      else if (row.dataset.pid) ({ error } = await sb.from("practice_answers").upsert({ practice_id: row.dataset.pid, member_id: me.id, available: val }));
      else ({ error } = await monthSave([{ date: row.dataset.date, kind: row.dataset.kind, available: val }]));
      if (error) { toast("저장하지 못했어요. 응답이 마감됐는지 확인해 주세요"); return renderRespond(); }
      row.querySelectorAll(".ans").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      if (row.dataset.sid) return afterServiceAnswer(row.dataset.sid, val);
      refresh();
    }));
  }

  // 사역 본 섬김을 바꾸면: 연습 칸이 바로 펼쳐지거나 숨겨지도록 다시 그리고, 새로 펼쳐진 칸으로 스크롤
  async function afterServiceAnswer(sid, val) {
    const had = !!document.querySelector(`#view-respond [data-prac-for~="${sid}"]`);
    const y = window.scrollY;
    await renderRespond();
    window.scrollTo(0, y);
    const box = document.querySelector(`#view-respond [data-prac-for~="${sid}"]`);
    if (val && box && !had) {
      box.classList.add("just");
      const r = box.getBoundingClientRect();
      if (r.top > window.innerHeight - 160 || r.bottom > window.innerHeight) window.scrollTo({ top: window.scrollY + r.top - 120, behavior: "smooth" });
    }
  }

  async function drawMonth(v, m, D, pick) {
    const slots = slotsOf(m.month);
    const ans = await myAnswers(m.month);
    const sats = await satRows(sundaysOf(m.month));
    const { data: noteRow } = await sb.from("availability_notes").select("note").eq("member_id", me.id).eq("month", m.month).maybeSingle();
    const val = (s) => ans.find((x) => x.date === s.date && x.kind === s.kind)?.available;
    const mins = D.list.filter((x) => x.response_mode === "monthly" && x.svs.some((s) => monthOf(s.service_date) === m.month));
    const total = slots.length + mins.reduce((n, x) => n + minCount(D, x).total, 0);
    const done = slots.filter((s) => val(s) !== undefined).length + mins.reduce((n, x) => n + minCount(D, x).done, 0);
    const save = (rows) => sb.from("availability").upsert(rows.map((r) => ({ member_id: me.id, ...r })));

    v.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${pick}
        <h1 style="font-size:22px;font-weight:800">${monthLabel(m.month)} 섬김 응답</h1>
        <div class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px 18px">
          <span class="muted small">${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지" : "마감일 미정"}</span>
          ${progress(done, total)}
          <button type="button" class="btn btn-soft" id="allYes">토요 연습·주일 전부 가능으로 채우기</button>
        </div>
      </div>
      ${sundaysOf(m.month).map((sun) => `<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:16px 18px">
        <h2 style="font-size:15px;font-weight:800">${fmtDate(sun, { month: "long", day: "numeric" })} 주일 주간</h2>
        ${slots.filter((s) => s.sun === sun).map((s) => ansRow(`data-date="${s.date}" data-kind="${s.kind}"`, s.kind === "sunday" ? "주일 예배" : "토요 연습",
          `${fmtDate(s.date, { month: "long", day: "numeric", weekday: "short" })} ${s.kind === "sunday" ? hm(ST.sunday_start) : hm(satTime(sats.find((x) => x.meeting_date === s.date), ST)[0])}`, val(s))).join("")}</section>`).join("")}
      ${mins.map((x) => `<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid var(--violet-soft)">
        <h2 style="font-size:15px;font-weight:800">${esc(x.name)} <span class="chip chip-violet">사역</span></h2>
        ${minRows(D, x)}</section>`).join("")}
      <label class="field" style="font-size:15px;font-weight:700">리더에게 전할 말
        <span class="hint">예: 11/15는 오후만 가능해요</span>
        <textarea id="respNote" maxlength="300" style="min-height:80px">${esc(noteRow?.note || "")}</textarea></label>
      <p class="muted small" style="margin:0;text-align:center">누르는 즉시 저장돼요. 마감 전까지 언제든 바꿀 수 있어요.</p>`;
    bindAnswers(v, total, save);
    mountPollInline(v, D);
    $("#allYes").addEventListener("click", async () => {
      const { error } = await save(slots.map((s) => ({ date: s.date, kind: s.kind, available: true })));
      if (error) return toast("저장하지 못했어요. 응답이 마감됐는지 확인해 주세요");
      renderRespond();
    });
    $("#respNote").addEventListener("change", async (e) => {
      const note = e.target.value.trim();
      const q = note
        ? sb.from("availability_notes").upsert({ member_id: me.id, month: m.month, note })
        : sb.from("availability_notes").delete().eq("member_id", me.id).eq("month", m.month);
      const { error } = await q;
      toast(error ? "저장하지 못했어요" : "리더에게 전할 말을 저장했어요");
    });
  }

  function drawMinistry(v, m, D, pick) {
    const c = minCount(D, m);
    const last = m.svs[m.svs.length - 1].service_date;
    const span = m.svs.length > 1 ? `${fmtDate(m.svs[0].service_date, { month: "long", day: "numeric", weekday: "short" })} – ${+last.slice(8)}일 (${["주일", "월", "화", "수", "목", "금", "토"][dowOf(last)]})` : "";
    const fixed = m.prs.filter((p) => p.practice_date >= todayISO());
    v.innerHTML = `${pick}
      <h1 style="font-size:22px;font-weight:800">${esc(m.name)} 섬김 응답</h1>
      <div class="card" style="display:flex;flex-direction:column;gap:8px;padding:14px 18px">
        <span class="muted small">${span ? span + " · " : ""}${m.response_deadline ? fmtDate(m.response_deadline, { month: "long", day: "numeric" }) + "까지" : "마감일 미정"}</span>
        ${progress(c.done, c.total)}
        ${m.practice_mode === "poll" && fixed.length ? `<span class="small"><b>연습</b> ${fixed.map((p) => `${mdw(p.practice_date)} ${timeRange(p.start_time, p.end_time)}`).join(", ")} <span class="chip chip-ok">확정</span></span>` : ""}
        ${m.practice_mode === "poll" && !fixed.length ? `<span class="small muted">연습 시간은 '가능'으로 답한 분께 따로 여쭤봐요.</span>` : ""}
      </div>
      <section class="card" style="display:flex;flex-direction:column;gap:12px">${minRows(D, m)}</section>
      <p class="muted small" style="margin:0;text-align:center">누르는 즉시 저장돼요. 마감 전까지 바꿀 수 있어요.</p>`;
    bindAnswers(v, c.total, null);
    mountPollInline(v, D);
  }

  // 연습 가능 시간 고르기 (30분 칸) — 취합 중인 사역이 여러 개면 한 화면에서 같이 받음
  //  한 번 누르면 선택, 다시 누르면 해제. 날짜를 누르면 그날 전체, 시간을 누르면 그 줄 전체. 누르는 즉시 저장
  //  고른 칸은 사역마다 그 사역의 후보 날짜·시간대에 들어가는 것만 나눠서 저장
  const PCOLORS = ["#8654CB", "#C0612B", "#1F7A8C", "#A3366E"];
  //  only: 이 사역들만 (섬김 응답 화면 안에 펼칠 때) · keep: 칠하는 중 다시 그리기
  function drawPoll(v, D, pick, only = null, keep = false) {
    const inline = !!only;
    const mins = D.list.filter((x) => pollable(D, x) && (!only || only.includes(x.id)));
    if (!mins.length) { v.innerHTML = ""; return; }
    const info = mins.map((mi, i) => ({ mi, color: PCOLORS[i % PCOLORS.length], days: new Set(pollDays(mi)), t0: toMin(mi.poll_day_start), t1: toMin(mi.poll_day_end) }));
    const covers = (x, d, t) => x.days.has(d) && toMin(t) >= x.t0 && toMin(t) < x.t1;
    const valid = (d, t) => info.some((x) => covers(x, d, t));
    const days = [...new Set(info.flatMap((x) => [...x.days]))].sort();
    const T0 = Math.min(...info.map((x) => x.t0)), T1 = Math.max(...info.map((x) => x.t1));
    const times = []; for (let t = T0; t < T1; t += 30) times.push(fromMin(t));
    const key = mins.map((m) => m.id).join(",");
    let paint = paints[key];
    // 새로 그릴 때는 저장된 값으로 맞춤 (다른 화면에서 칠한 것 반영). 저장 대기 중이면 그대로
    if (!paint || (!keep && !paint.pending)) {
      const mine = (mi) => (D.po.find((p) => p.ministry_id === mi.id)?.slots || []).slice().sort();
      paint = paints[key] = { key, page: paint?.page || 0, sel: new Set(mins.flatMap(mine)), saved: Object.fromEntries(mins.map((mi) => [mi.id, JSON.stringify(mine(mi))])), at: paint?.at || "" };
    }
    // 7일이 넘으면 주(주일~토) 단위로 넘김
    const wk = (d) => addDays(d, -dowOf(d));
    const pages = days.length > 7 ? [...new Set(days.map(wk))].map((w) => days.filter((d) => wk(d) === w)) : [days];
    if (paint.page >= pages.length) paint.page = 0;
    const pd = pages[paint.page] || [];
    const DOW = ["주일", "월", "화", "수", "목", "금", "토"];
    const cols = `grid-template-columns:46px repeat(${pd.length}, minmax(0,1fr))`;
    const lenText = (n) => n % 60 ? `${Math.floor(n / 60)}시간 ${n % 60}분` : `${n / 60}시간`;
    const dls = mins.map((x) => x.poll_deadline).filter(Boolean).sort();
    // 사역별 요약: 고른 시간 + 연습 길이만큼 이어진 곳
    const summary = info.map((x) => {
      const L = Math.ceil((x.mi.practice_minutes || 120) / 30), parts = []; let long = 0;
      [...x.days].sort().forEach((d) => {
        let run = null;
        for (let t = x.t0; t <= x.t1; t += 30) {
          const on = t < x.t1 && paint.sel.has(`${d} ${fromMin(t)}`);
          if (on && run === null) run = t;
          if (!on && run !== null) { parts.push(`${md(d)} ${fromMin(run)}–${fromMin(t)}`); long += Math.max(0, Math.floor((t - run) / 30) - L + 1) > 0 ? 1 : 0; run = null; }
        }
      });
      return `<div><span style="display:flex;align-items:center;gap:6px"><span class="mtag2" style="background:${x.color}">${esc(x.mi.name)}</span>
        <b class="small" style="color:${!parts.length || !long ? "var(--warn)" : "var(--ok)"}">${!parts.length ? "아직 안 골랐어요" : long ? `${lenText(x.mi.practice_minutes)} 이어진 시간 ${long}곳` : `${lenText(x.mi.practice_minutes)} 이어진 시간이 없어요`}</b></span>
        <span class="small muted" style="line-height:1.5">${parts.join(" · ") || "날짜 아래 표시를 보고 이 사역 날짜에서 골라 주세요"}</span></div>`;
    }).join("");

    v.innerHTML = `${pick}
      ${inline ? `<div class="poll-in-hd"><b>연습 가능 시간 고르기</b><span class="small muted">본 섬김 '가능'이라 연습 시간도 여쭤봐요</span></div>`
        : `<h1 style="font-size:22px;font-weight:800">연습 시간 고르기</h1>`}
      <div class="card" style="display:flex;flex-direction:column;gap:8px;padding:14px 18px${inline ? ";background:var(--bg)" : ""}">
        <span class="muted small">${mins.length > 1 ? `'가능'으로 답한 사역 ${mins.length}개의 연습 시간을 한 번에 받아요. ` : ""}되는 칸을 누르면 바로 저장돼요.</span>
        ${info.map((x) => `<span class="small" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="mtag2" style="background:${x.color}">${esc(x.mi.name)}</span>
          ${x.mi.svs.filter((s) => myAvail(D, s.id) === true).map((s) => `${mdw(s.service_date)}${x.mi.svs.length > 1 && s.label ? " " + esc(s.label) : ""}`).join(", ")} · 연습 ${lenText(x.mi.practice_minutes)} · ${hm(x.mi.poll_day_start)}–${hm(x.mi.poll_day_end)}</span>`).join("")}
        ${dls.length ? `<b class="small" style="color:var(--warn)">${fmtDate(dls[0], { month: "long", day: "numeric", weekday: "short" })}까지</b>` : ""}
      </div>
      <div class="wkpager">${pages.length > 1 ? pages.map((p, i) => `<button type="button" class="btn btn-ghost btn-sm" data-page="${i}" aria-pressed="${i === paint.page}">${md(p[0])} 주</button>`).join("") : ""}
        <span style="flex:1"></span><button type="button" class="btn btn-ghost btn-sm" data-pclear>모두 지우기</button></div>
      <span class="small muted" style="margin-top:-8px">날짜를 누르면 그날 전체, 시간을 누르면 그 줄 전체가 켜지고 꺼져요.</span>
      <div class="pick2-wrap" data-pwrap>
        <div class="pick2-head"><div class="pick2" style="${cols};padding:0">
          <span class="small muted" style="align-self:end;text-align:center;font-size:10px">시간</span>
          ${pd.map((d) => {
            const mine = info.filter((x) => x.days.has(d)), any = times.some((t) => paint.sel.has(`${d} ${t}`)), dw = dowOf(d);
            return `<button type="button" class="dh ${dw === 0 || dw === 6 ? "we" : ""} ${any ? "any" : ""}" data-day="${d}" aria-label="${mdw(d)} 전체">
              <b>${+d.slice(8)}</b><span>${DOW[dw]}</span>${mine.map((x) => `<i style="background:${x.color}">${esc(x.mi.name)}</i>`).join("")}</button>`;
          }).join("")}</div></div>
        <div class="pick2" style="${cols}">
          ${times.map((t) => `<button type="button" class="th" data-time="${t}" aria-label="${t} 줄 전체">${t.endsWith(":00") ? t : ""}</button>${pd.map((d) => {
            const k = `${d} ${t}`, ok = valid(d, t);
            return `<button type="button" class="c" data-k="${k}" aria-pressed="${ok && paint.sel.has(k)}" ${ok ? "" : "disabled"} aria-label="${mdw(d)} ${t}${ok ? "" : " 받지 않는 시간"}"></button>`;
          }).join("")}`).join("")}
        </div>
      </div>
      <div class="psum">${summary}</div>
      <p class="small" style="margin:0;text-align:center;font-weight:700;color:var(--ok)" data-psaved>${paint.at || "누르는 즉시 저장돼요"}</p>`;

    const redraw = () => { drawPoll(v, D, pick, only, true); };
    const save = () => {
      clearTimeout(paint.timer);
      paint.pending = true;
      paint.timer = setTimeout(async () => {
        let fail = false;
        for (const x of info) {
          const slots = [...paint.sel].filter((k) => { const [d, t] = k.split(" "); return covers(x, d, t); }).sort();
          const js = JSON.stringify(slots);
          if (js === paint.saved[x.mi.id]) continue;
          const { error } = await sb.from("ministry_poll").upsert({ ministry_id: x.mi.id, member_id: me.id, slots });
          if (error) { fail = true; continue; }
          paint.saved[x.mi.id] = js;
          const row = D.po.find((p) => p.ministry_id === x.mi.id);
          if (row) row.slots = slots; else D.po.push({ ministry_id: x.mi.id, slots });
        }
        const n = new Date();
        paint.at = fail ? "" : `저장됨 · ${n.getHours()}:${String(n.getMinutes()).padStart(2, "0")}`;
        if (fail) toast("저장하지 못했어요. 취합이 마감됐는지 확인해 주세요");
        paint.pending = false;
        const el = v.querySelector("[data-psaved]"); if (el) el.textContent = paint.at || "저장하지 못했어요";
      }, 400);
    };
    const setMany = (keys) => {
      if (!keys.length) return;
      const all = keys.every((k) => paint.sel.has(k));
      keys.forEach((k) => (all ? paint.sel.delete(k) : paint.sel.add(k)));
      save(); redraw();
    };
    v.querySelector("[data-pwrap]").addEventListener("click", (e) => {
      const c = e.target.closest(".c");
      if (c && !c.disabled) { paint.sel.has(c.dataset.k) ? paint.sel.delete(c.dataset.k) : paint.sel.add(c.dataset.k); save(); return redraw(); }
      const dh = e.target.closest("[data-day]");
      if (dh) return setMany(times.filter((t) => valid(dh.dataset.day, t)).map((t) => `${dh.dataset.day} ${t}`));
      const th = e.target.closest("[data-time]");
      if (th) return setMany(pd.filter((d) => valid(d, th.dataset.time)).map((d) => `${d} ${th.dataset.time}`));
    });
    $$("[data-page]", v).forEach((b) => b.addEventListener("click", () => { paint.page = +b.dataset.page; redraw(); }));

  // ---------- 배치표 ----------
  let lineupMonth = null, lineupMode = "list", lineupTab = "month";

  function drawLineupTable(v, groups, multi, head) {

    const multiTab = lineupTab !== "month";
    const nameOf = (r) => String(r.member_name).replace(/ \(객원\)$/, "(G)");
    const rows = shown.map((list) => {
      const h = list[0];
      const cell = (code) => list.filter((r) => r.position_code === code).sort((a, b) => a.slot - b.slot).map((r) => ({ n: nameOf(r), b: !!(r.is_singer_leader || r.is_band_master), me: r.member_id === me.id }));
      return { date: LTABLE.korDate(h.service_date), sub: h.ministry_id ? (multiTab ? (h.label || h.ministry_name) : h.ministry_name) : "", green: !!h.ministry_id && !multiTab,

        <span class="muted small">옆으로 밀어 보세요. 굵은 이름 = 싱어 리더·밴드 마스터, 보라 바탕 = 나</span>

            <span class="muted small">${sub}</span></div>
          ${h.note ? `<p class="muted small" style="margin:0 0 4px">${esc(h.note)}</p>` : ""}
          ${list.map((r) => `<div style="display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;${r.member_id === me.id ? "background:var(--tint);" : ""}">
            <span class="muted small" style="font-weight:600">${esc(r.position_name)}</span>
            <span style="font-weight:${r.member_id === me.id ? 800 : 500};${r.member_id === me.id ? "color:var(--violet)" : ""}">${esc(r.member_name)}${r.member_id === me.id ? " (나)" : ""}</span>
            ${role(r) ? `<span class="chip chip-violet">${role(r)}</span>` : "<span></span>"}</div>`).join("")}
        </section>`;

      const mine = $$("section.card.bordered[data-date]", v);

  // ---------- 013: 알림 (벨 · 알림함 · 이 기기 알림) ----------
  async function refreshBell() {
    const b = $("#bell"); if (!b || !me) return;
    const { count } = await sb.from("notification_inbox").select("notification_id", { count: "exact", head: true }).eq("member_id", me.id).is("read_at", null);
    b.innerHTML = `${ICON.bell}${count ? `<span class="n">${count > 99 ? "99+" : count}</span>` : ""}`;

  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshBell(); });

  // 이 기기 알림 켜기/끄기 카드 (알림함 · 내 정보 · 설치 안내 3단계에서 같이 씀)
  const DEV_TEXT = {
    on: ["켜짐", "이 휴대폰으로 알림이 와요"],

    denied: ["차단됨", "휴대폰 설정 › 알림에서 이 앱(또는 브라우저)의 알림을 허용해 주세요"],
    install: ["홈 화면 앱에서 켤 수 있어요", "아이폰은 홈 화면에 추가한 앱에서만 알림을 받아요"],

  async function renderDevCard(el, { compact = false } = {}) {
    if (!el) return;

    const can = st === "on" || st === "off";
    el.innerHTML = `<div class="devrow"><span><b style="font-size:15px">이 기기 알림 · ${t}</b><span class="muted small">${sub}</span></span>
        ${can ? `<button type="button" class="switch" role="switch" aria-checked="${st === "on"}" aria-label="이 기기 알림" data-dev></button>`
          : st === "denied" ? "" : `<a class="btn btn-soft btn-sm" href="#install">방법 보기</a>`}</div>
      ${!compact && can ? `<p class="muted small" style="margin:10px 0 0">알림은 기기마다 켜요. 응답 요청 · 배치표 · 연습 · 공지가 와요.</p>` : ""}`;

      } catch (err) { toast(err.message, 4500); }

  let alertFilter = "all";
  async function renderAlerts() {
    const v = $("#view-alerts");

      .eq("member_id", me.id).order("notification_id", { ascending: false }).limit(80);
    const all = (data || []).filter((x) => x.notifications);
    const list = all.filter((x) => alertFilter === "all" || x.notifications.kind === "notice");
    const nids = all.filter((x) => x.notifications.kind === "notice").map((x) => x.notification_id);
    const votes = new Map();
    if (nids.length) {
      const { data: ps } = await sb.from("polls").select("id, notification_id").in("notification_id", nids);
      if (ps?.length) {
        const { data: vs } = await sb.rpc("poll_views", { p_ids: ps.map((x) => x.id) });
        (vs || []).forEach((p) => { voteState[p.id] = p; votes.set(p.notification_id, p); });
      }
    }
    const unread = all.filter((x) => !x.read_at).length;
    v.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between"><h1 style="font-size:22px;font-weight:800">알림</h1>
        ${unread ? `<button type="button" class="btn btn-ghost btn-sm" id="readAll">모두 읽음</button>` : ""}</div>

      <div class="alist">${list.map((x) => {

          <span class="top">${votes.has(x.notification_id) ? `<span class="ktag vtag">투표</span>` : `<span class="ktag ${n.kind}">${NOTIFY_KIND[n.kind] || "알림"}</span>`}<b>${esc(x.title)}</b>${x.read_at ? "" : `<span class="dot" aria-label="안 읽음"></span>`}</span>
          ${x.body ? `<span class="bd">${esc(x.body)}</span>` : ""}<span class="when">${fmtDateTime(n.created_at)}</span></a>${votes.has(x.notification_id) ? voteCard(votes.get(x.notification_id)) : ""}`;
      }).join("") || `<div class="empty">${alertFilter === "notice" ? "받은 공지가 없어요." : "아직 받은 알림이 없어요."}</div>`}</div>`;

    $("#readAll")?.addEventListener("click", async () => { await sb.rpc("mark_notifications_read", { p_ids: null }); renderAlerts(); refreshBell(); });

    }
  }

      <span><b>${title}</b><span class="muted small">응답 요청 · 배치표 · 공지를 휴대폰 알림으로 받아요</span></span>
      <a class="btn btn-primary btn-sm" href="#install">${st === "off" && PWA.isStandalone() ? "켜기" : "방법 보기"}</a>
      <button type="button" class="x" id="appBannerX" aria-label="닫기">${XSVG}</button></div>`);
    $("#appBannerX").addEventListener("click", () => { try { localStorage.setItem("pole2.appBanner", String(Date.now() + 14 * 864e5)); } catch {} $("#appBanner").remove(); });
  }
  const XSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;


  // ---------- 015: 기도 (이번 주 기도제목 · 기도했습니다 · 지난 기도제목) ----------
  //  기도 주간 = 토요일(팀모임)부터 다음 금요일까지. 누구나 올리고, 소그룹 나눔 리더는 여러 명을 한 번에 올려요
  let roster = null, prayForm = null, prayEditing = null, prayOpen = new Set();
  const prayWeek = (iso = todayISO()) => lastSaturday(iso);
  async function loadRoster() {
    if (!roster) { const { data } = await sb.rpc("team_roster"); roster = data || []; }
    return roster;
  }
  const nameOf = (id) => roster?.find((m) => m.id === id)?.name || "";
  async function meApi(path, payload) {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "보내지 못했어요");
    return j;
  }
  async function homePrayLink() {   // 홈에 '이번 주 기도제목' 바로가기
    const { count } = await sb.from("prayers").select("id", { count: "exact", head: true }).eq("week_of", prayWeek());
    if (!count) return "";
    return `<a class="notice-link" href="#pray"><span style="display:flex;flex-direction:column;gap:2px"><b>이번 주 기도제목 ${count}개</b><span class="muted small">함께 기도해요</span></span>
      <span class="chip chip-violet" style="border-radius:999px;padding:6px 12px">기도</span></a>`;
  }
  const pcardHTML = (p, editable) => prayEditing === p.id
    ? `<article class="pcard" data-pid="${p.id}"><div class="pc-hd"><b>${esc(nameOf(p.member_id) || "팀원")}</b></div>
        <textarea class="input" data-pedit maxlength="500">${esc(p.body)}</textarea>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-pcancel>취소</button><button type="button" class="btn btn-primary btn-sm" data-psave="${p.id}">저장</button></div></article>`
    : `<article class="pcard ${p.urgent ? "urgent" : ""}" data-pid="${p.id}"><div class="pc-hd"><b>${esc(nameOf(p.member_id) || "팀원")}</b>${p.urgent ? `<span class="chip chip-warn">급한 기도</span>` : ""}</div>
        <p class="pc-body">${esc(p.body)}</p>
        <div class="pc-meta"><span>${p.author_id && p.author_id !== p.member_id ? esc(nameOf(p.author_id) || "팀원") + " 올림 · " : ""}${mdw(fmtISO(p.created_at))}</span>
          ${editable ? `<span class="row" style="gap:2px"><button type="button" class="linkbtn" data-pe="${p.id}">수정</button><button type="button" class="linkbtn" data-pd="${p.id}">지우기</button></span>` : ""}</div></article>`;
  const fmtISO = (ts) => new Date(ts).toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });

  async function renderPray() {
    const v = $("#view-pray");
    const dp = deep?.v === "pray" ? deep : null; if (dp) deep = null;
    const week = prayWeek(), from = addDays(week, -56);
    const [ps, st] = await Promise.all([
      sb.from("prayers").select("*").gte("week_of", from).order("created_at", { ascending: true }),
      sb.rpc("prayer_status", { p_from: from }), loadRoster(),
    ]);
    const all = ps.data || [], S2 = st.data || { weeks: [] };
    const totalOf = (w) => S2.weeks?.find((x) => x.week_of === w)?.total || 0;
    const cur = all.filter((p) => p.week_of === week);
    const past = [...new Set(all.filter((p) => p.week_of < week).map((p) => p.week_of))].sort().reverse();
    const can = (p) => p.author_id === me.id || me.role === "admin";
    const next = S2.next_at && new Date(S2.next_at) > new Date() ? new Date(S2.next_at) : null;
    const people = new Set(cur.map((p) => p.member_id)).size;
    v.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px"><h1 style="font-size:22px;font-weight:800">이번 주 기도제목</h1>
        <span class="muted small">${fmtDate(week, { month: "long", day: "numeric", weekday: "short" })} 팀모임 주간${cur.length ? ` · ${people}명 · ${cur.length}개` : ""}</span></div>
      ${prayForm ? prayFormHTML() : `<button type="button" class="btn btn-primary" id="pNew">+ 기도제목 올리기</button>`}
      <div class="plist2">${cur.map((p) => pcardHTML(p, can(p))).join("") || `<div class="empty">아직 이번 주 기도제목이 없어요.<br>팀모임 나눔 뒤 나눔 리더가 올려 줘요. 급한 기도제목은 누구나 올려도 돼요.</div>`}</div>
      ${cur.length ? `<section class="praybar"><span><small>이번 주 함께 기도한 횟수</small><b id="pTotal">${totalOf(week)}</b>번</span>
        <button type="button" class="btn ${next ? "btn-ghost" : "btn-primary"}" id="pPray" ${next ? "disabled" : ""}>${next ? `고마워요 · ${next.getHours()}:${String(next.getMinutes()).padStart(2, "0")}부터 다시` : "🙏 기도했습니다"}</button></section>` : ""}
      ${past.length ? `<h2 style="font-size:16px;font-weight:800;margin-top:6px">지난 기도제목</h2>
        ${past.map((w) => { const list = all.filter((p) => p.week_of === w); return `<details class="pweek" data-week="${w}" ${prayOpen.has(w) ? "open" : ""}><summary><b>${md(w)} 주간</b><span class="muted small">기도제목 ${list.length}개 · 함께 기도 ${totalOf(w)}번</span></summary>
          <div class="plist2">${list.map((p) => pcardHTML(p, can(p))).join("")}</div></details>`; }).join("")}` : ""}`;
    bindPray(v);
    if (dp) {
      const el = v.querySelector(`.pcard[data-pid="${+dp.arg}"]`);
      if (el) { el.closest("details")?.setAttribute("open", ""); hit(el); }
      else if (dp.arg) deepNote(v, "그 기도제목은 지워졌어요.");
    }
  }

  function prayFormHTML() {
    const opts = (sel) => `<option value="">이름 고르기</option>${roster.map((m) => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${esc(m.name)}${m.status === "trainee" ? " (수습)" : ""}</option>`).join("")}`;
    return `<section class="card pform" id="pForm">
      <div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:16px">기도제목 올리기</b>
        <span class="muted small">나눔 리더는 '한 명 더'로 여러 명을 한 번에 올릴 수 있어요.</span></div>
      ${prayForm.rows.map((r, i) => `<div class="prow2" data-i="${i}">
        <div class="row" style="flex-wrap:nowrap"><select class="select" data-who aria-label="누구의 기도제목">${opts(r.who)}</select>
          ${prayForm.rows.length > 1 ? `<button type="button" class="linkbtn" data-rm="${i}" aria-label="이 줄 빼기">빼기</button>` : ""}</div>
        <textarea class="input" data-body maxlength="500" placeholder="기도제목을 적어 주세요">${esc(r.body)}</textarea></div>`).join("")}
      <button type="button" class="btn btn-ghost btn-sm" id="pAdd" style="align-self:flex-start">+ 한 명 더</button>
      <label class="checkrow"><input type="checkbox" id="pUrgent" ${prayForm.urgent ? "checked" : ""}><span><b>급한 기도</b><small>올리면 바로 팀원 전체에게 알림이 가요</small></span></label>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" id="pCancel">취소</button><button type="button" class="btn btn-primary" id="pSubmit">올리기</button></div>
    </section>`;
  }

  function bindPray(v) {
    const keep = () => {   // 폼 입력값 보존
      if (!prayForm) return;
      $$(".prow2", v).forEach((row) => { const r = prayForm.rows[+row.dataset.i]; r.who = row.querySelector("[data-who]").value; r.body = row.querySelector("[data-body]").value; });
      prayForm.urgent = !!$("#pUrgent")?.checked;
    };
    $("#pNew")?.addEventListener("click", () => { prayForm = { rows: [{ who: me.id, body: "" }], urgent: false }; renderPray().then(() => $("#pForm [data-body]")?.focus()); });
    $("#pCancel")?.addEventListener("click", () => { prayForm = null; renderPray(); });
    $("#pAdd")?.addEventListener("click", () => { keep(); prayForm.rows.push({ who: "", body: "" }); renderPray().then(() => { const b = $$("#pForm [data-body]"); b[b.length - 1]?.closest(".prow2").querySelector("[data-who]").focus(); }); });
    $$("[data-rm]", v).forEach((b) => b.addEventListener("click", () => { keep(); prayForm.rows.splice(+b.dataset.rm, 1); renderPray(); }));
    $("#pSubmit")?.addEventListener("click", async (e) => {
      keep();
      const rows = prayForm.rows.map((r) => ({ who: r.who, body: r.body.trim() })).filter((r) => r.who || r.body);
      if (!rows.length) return toast("기도제목을 적어 주세요");
      if (rows.some((r) => !r.who)) return toast("이름을 골라 주세요");
      if (rows.some((r) => !r.body)) return toast("기도제목을 적어 주세요");
      e.currentTarget.disabled = true;
      const { data, error } = await sb.from("prayers").insert(rows.map((r) => ({ member_id: r.who, body: r.body, urgent: prayForm.urgent, author_id: me.id }))).select("id");
      if (error) { e.currentTarget.disabled = false; return toast("올리지 못했어요. 다시 시도해 주세요", 3500); }
      const urgent = prayForm.urgent;
      prayForm = null;
      let msg = `기도제목 ${rows.length}개를 올렸어요`;
      if (urgent) {
        try { const r = await meApi("/api/notify", { kind: "prayer_urgent", prayer_ids: (data || []).map((x) => x.id) }); if (!r.skipped) msg += ` · ${r.recipients}명에게 알렸어요`; }
        catch (err) { msg += ` · ${err.message}`; }
      }
      toast(msg, 4000); renderPray();
    });
    $$("[data-pe]", v).forEach((b) => b.addEventListener("click", () => { prayEditing = +b.dataset.pe; renderPray().then(() => $("[data-pedit]")?.focus()); }));
    $$("[data-pcancel]", v).forEach((b) => b.addEventListener("click", () => { prayEditing = null; renderPray(); }));
    $$("[data-psave]", v).forEach((b) => b.addEventListener("click", async () => {
      const body = b.closest(".pcard").querySelector("[data-pedit]").value.trim();
      if (!body) return toast("기도제목을 적어 주세요");
      const { error } = await sb.from("prayers").update({ body }).eq("id", +b.dataset.psave);
      if (error) return toast("저장하지 못했어요");
      prayEditing = null; toast("고쳤어요"); renderPray();
    }));
    $$("[data-pd]", v).forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("이 기도제목을 지울까요?")) return;
      const { error } = await sb.from("prayers").delete().eq("id", +b.dataset.pd);
      toast(error ? "지우지 못했어요" : "지웠어요"); renderPray();
    }));
    $$("details.pweek", v).forEach((d) => d.addEventListener("toggle", () => { d.open ? prayOpen.add(d.dataset.week) : prayOpen.delete(d.dataset.week); }));
    $("#pPray")?.addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true;
      const { data, error } = await sb.rpc("pray");
      if (error) { b.disabled = false; return toast("누르지 못했어요. 다시 시도해 주세요"); }
      $("#pTotal").textContent = data.total;
      const n = new Date(data.next_at);
      b.className = "btn btn-ghost"; b.textContent = `고마워요 · ${n.getHours()}:${String(n.getMinutes()).padStart(2, "0")}부터 다시`;
      if (data.ok) { toast("함께 기도해 주셔서 고마워요"); b.closest(".praybar").classList.add("deep-hit"); }
    });
  }

  // ---------- 014: 새로고침해도 보던 탭 유지 (이 브라우저 탭 안에서만) ----------
  const UI_KEY = "pole2.me.ui";
  try {
    const u = JSON.parse(sessionStorage.getItem(UI_KEY) || "{}");
    if (u.respondKey) respondKey = u.respondKey;
    if (u.lineupMonth) lineupMonth = u.lineupMonth;
    if (u.lineupMode) lineupMode = u.lineupMode;
    if (u.lineupTab) lineupTab = u.lineupTab;
    if (u.alertFilter) alertFilter = u.alertFilter;
  } catch {}
  const saveUI = () => { try { sessionStorage.setItem(UI_KEY, JSON.stringify({ respondKey, lineupMonth, lineupMode, lineupTab, alertFilter })); } catch {} };
  window.addEventListener("pagehide", saveUI);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveUI(); });

  // ---------- 내 정보 ----------
  function renderInfo() {
    $("#posInfo").innerHTML = `<dt>주 포지션</dt><dd>${esc(positionName(me.main_position))}</dd>
      ${extras.length ? `<dt>추가 포지션</dt><dd>${extras.map((e) => esc(positionName(e.position_code))).join(", ")}</dd>` : ""}
      <dt>구분</dt><dd>${me.status === "trainee" ? "수습" : "정식 팀원"}</dd>
      <dt>기수</dt><dd>${me.cohort ? me.cohort + "기" : "—"}</dd>
      <dt>생년월일</dt><dd>${me.birth_date ? birthLabel(me.birth_date) : "—"}</dd>
      <dt>생일선물 정산</dt><dd>${me.gift_join === true ? "참여" : me.gift_join === false ? "미참여" : "미정"}</dd>`;
    $("#posInfo").insertAdjacentHTML("afterend", `<p class="muted small" style="margin:10px 0 0">기수·생년월일·생일선물 정산은 리더십만 볼 수 있어요. 바꿀 게 있으면 리더십에게 말씀해 주세요.</p>`);
    if (!app) { $("#appCard").classList.add("hidden"); return; }
    $("#appInfo").innerHTML = `<dt>이름</dt><dd>${esc(app.name)}</dd><dt>연락처</dt><dd>${esc(app.phone)}</dd>
      <dt>이메일</dt><dd>${esc(app.email)}</dd><dt>순모임</dt><dd>${esc(app.small_group) || "—"}</dd>
      <dt>지원 포지션</dt><dd>${esc(positionName(app.applied_position))}</dd>
      <dt>지원 동기</dt><dd>${esc(app.motivation) || "—"}</dd><dt>이루고 싶은 것</dt><dd>${esc(app.goal) || "—"}</dd>`;
    $("#pledgeTitle").textContent = app.pledge_title;
    $("#pledge").textContent = app.pledge_content;
    $("#pledgedAt").textContent = `${fmtDate(app.pledged_at, { year: "numeric", month: "long", day: "numeric" })}에 서약했어요.`;
  }
</script>
</body>
</html>
