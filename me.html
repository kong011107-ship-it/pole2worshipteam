<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#410A85">
  <title>Pole2 찬양팀</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css?v=11">
</head>
<body>
<div class="m-wrap">
  <header class="topbar">
    <img src="assets/logo-violet.png" alt="Pole2">
    <span class="who"><span id="whoName"></span><span id="whoBadge"></span></span>
  </header>

  <main class="m-main" id="view-home"></main>

  <main class="m-main hidden" id="view-respond"></main>
  <main class="m-main hidden" id="view-lineup"></main>

  <main class="m-main hidden" id="view-info">
    <section class="card">
      <div class="card-head"><h2 class="card-title">내 포지션</h2></div>
      <dl class="kv" id="posInfo"></dl>
    </section>
    <section class="card" id="appCard">
      <div class="card-head"><h2 class="card-title">내 지원서와 서약</h2></div>
      <p class="muted small" style="margin: -4px 0 12px">지원할 때 작성한 내용이에요. 고칠 부분이 있으면 리더에게 말씀해 주세요.</p>
      <dl class="kv" id="appInfo" style="margin-bottom: 14px"></dl>
      <details open><summary style="cursor: pointer; font-weight: 700; color: var(--violet); margin-bottom: 8px" id="pledgeTitle"></summary>
        <div class="pledge-box" id="pledge"></div>
        <p class="muted small" id="pledgedAt" style="margin: 8px 0 0"></p>
      </details>
    </section>
    <button type="button" class="btn btn-ghost" onclick="logout()">로그아웃</button>
  </main>
</div>

<nav class="tabbar" aria-label="하단 메뉴"><div class="tabbar-inner" id="tabbar"></div></nav>

<script src="assets/config.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/common.js?v=11"></script>
<script>
  let ctx, me, app, extras = [], ST;

  (async function init() {
    ctx = await requireMember();
    if (!ctx) return;
    me = ctx.me;
    await loadPositions();
    ST = await loadSettings();
    $("#whoName").textContent = `${me.name}님`;
    $("#whoBadge").innerHTML = me.status === "trainee" ? `<span class="chip chip-violet">수습</span>`
      : me.role === "admin" ? `<a href="admin.html" class="chip chip-solid" style="text-decoration:none">관리자 화면</a>` : "";

    const [a, x] = await Promise.all([
      sb.from("applications").select("*").eq("user_id", me.id).maybeSingle(),
      sb.from("member_extra_positions").select("position_code").eq("member_id", me.id),
    ]);
    app = a.data; extras = x.data || [];

    renderTabbar();
    renderInfo();
    if (me.status === "trainee") {
      const { data: pps } = await sb.rpc("my_trainee_postpones");
      renderTraineeHome(pps || []);
      $("#view-home").insertAdjacentHTML("beforeend", await meetingCard());
    } else await renderMemberHome();
    showView();
  })();

  // ---------- 탭 ----------
  function renderTabbar() {
    const tabs = me.status === "trainee"
      ? [["home", "홈", ICON.home], ["info", "내 정보", ICON.user]]
      : [["home", "홈", ICON.home], ["respond", "섬김 응답", ICON.check], ["lineup", "배치표", ICON.table], ["info", "내 정보", ICON.user]];
    $("#tabbar").innerHTML = tabs.map(([id, label, icon]) =>
      `<button type="button" data-tab="${id}">${icon}${label}</button>`).join("");
    $("#tabbar").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (location.hash.slice(1) === b.dataset.tab) showView(); else location.hash = b.dataset.tab;
    });
  }
  function showView() {
    if (!me) return;   // 아직 불러오는 중이면 init이 끝난 뒤 다시 호출됨
    const allowed = me.status === "trainee" ? ["home", "info"] : ["home", "respond", "lineup", "info"];
    const h = location.hash.slice(1);
    const v = allowed.includes(h) ? h : "home";
    ["home", "respond", "lineup", "info"].forEach((k) => $(`#view-${k}`).classList.toggle("hidden", v !== k));
    $$("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === v));
    if (v === "respond") renderRespond();
    if (v === "lineup") renderLineup();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", showView);

  // ---------- 이번 주 팀모임 + 최근 출석 ----------
  async function meetingCard() {
    const sat = upcomingSaturday();
    const [tm, at] = await Promise.all([
      sb.from("team_meetings").select("meeting_date, meeting_status").eq("meeting_date", sat).maybeSingle(),
      sb.from("attendance").select("status, kind, team_meetings(meeting_date, meeting_status)").eq("member_id", me.id).eq("kind", "meeting"),
    ]);
    const ms = tm.data?.meeting_status || "tbd";
    const chip = { yes: "chip-ok", no: "chip-gray", tbd: "chip-mid" }[ms];
    const sub = { yes: "토요 연습 후 함께 모여요", no: "이번 주는 팀모임이 없어요", tbd: "정해지면 여기에 보여요" }[ms];
    const recs = (at.data || []).filter((r) => r.team_meetings && r.team_meetings.meeting_status === "yes")
      .sort((a, b) => b.team_meetings.meeting_date.localeCompare(a.team_meetings.meeting_date)).slice(0, 5).reverse();
    const attended = recs.filter((r) => r.status === "present" || r.status === "late").length;
    const color = (s) => s === "present" ? "var(--violet)" : s === "late" ? "#D9A066" : s === "excused" ? "#C3BACF" : "#D8D2E3";
    return `<section class="card" id="meetCard" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">이번 주 팀모임 · ${fmtDate(sat, { month: "long", day: "numeric", weekday: "short" })}</span>
          <b style="font-size:17px">${sub}</b></span>
        <span class="chip ${chip}" style="font-size:14px;padding:6px 12px;border-radius:999px">${MEETING[ms]}</span>
      </div>
      ${recs.length ? `<div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">최근 팀모임 출석</span><b>${recs.length}번 중 ${attended}번</b></span>
        <span style="display:flex;gap:6px" role="img" aria-label="최근 ${recs.length}번 중 ${attended}번 출석">${recs.map((r) =>
          `<span title="${fmtDate(r.team_meetings.meeting_date)} ${ATT[r.status]}" style="width:10px;height:10px;border-radius:999px;background:${color(r.status)}"></span>`).join("")}</span></div>` : ""}
    </section>`;
  }

  // ---------- 수습생 홈 ----------
  function renderTraineeHome(pps) {
    const start = app?.trainee_start;
    const st = traineeState(start, pps), w = st.week;
    const cur = TRAINEE_WEEKS[Math.min(Math.max(w, 1), 5) - 1];
    let hero;
    if (!start || w === 0) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">수습을 곧 시작해요</span>
        <span class="sub">${start ? fmtDate(st.resume, { weekday: "short" }) + " 토요 연습부터 함께해요." : "시작일은 리더가 안내해 드려요."}</span>`;
    } else if (st.paused) {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차까지 완료</b></div>
        <span class="big">${st.nextWeek}주차가 미뤄졌어요</span>
        <span class="sub">${fmtDate(st.resume, { month: "long", day: "numeric", weekday: "short" })} 토요 연습부터 다시 함께해요.</span>
        <div class="weekbar" aria-label="5주 중 ${w}주 완료">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    } else if (w > 5) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">5주 과정을 마쳤어요</span>
        <span class="sub">리더십과 커피챗 후 정식 전환을 안내해 드려요.</span>`;
    } else {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차 / 5주</b></div>
        <span class="big">${esc(cur.title)}</span>
        <span class="sub">${esc(cur.desc)}</span>
        <div class="weekbar" aria-label="5주 중 ${w}주차">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    }

    let schedule = "";
    if (start && w >= 0 && w <= 5) {
      const n = st.paused ? st.nextWeek : Math.max(w, 1);
      const sat = traineeWeekSat(start, n, pps), sun = addDays(sat, 1);
      schedule = `<section class="card" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="card-title">${w === 0 ? "첫 주 일정" : st.paused ? `다시 시작하는 ${n}주차 일정` : "이번 주 일정"}</h2>
        ${row(md(sat), "토", `토요 팀 연습 · ${hm(ST.sat_practice_start)}`, n >= 3 ? TRAINEE_WEEKS[n - 1].desc : "연습을 함께 지켜보며 팀 문화에 적응해요")}
        ${row(md(sun), "주일", "오전 9시 세팅 참관", "예배 후 리더십과 나눔")}
      </section>`;
    }
    function row(d, day, t, s) {
      return `<div style="display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start">
        <span class="small" style="font-weight:700;color:var(--violet);background:var(--tint);border-radius:8px;padding:6px 0;text-align:center">${d}<br>${day}</span>
        <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(t)}</b><span class="muted small">${esc(s)}</span></span></div>`;
    }

    const steps = [[1, "1~2주", "참관 + 적응"], [3, "3주", "부담 적은 투입"], [4, "4주", "실전 연주 · 지정곡 1곡"], [5, "5주", "전환 면접 · 리더십과 커피챗"]];
    const list = steps.map(([n, r, t]) => {
      const end = n === 1 ? 2 : n;
      const state = w > end ? "done" : w >= n ? "now" : "todo";
      const mark = state === "done"
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--violet-mid)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
        : state === "now" ? `<span role="img" aria-label="진행 중" style="width:12px;height:12px;border-radius:999px;background:var(--violet);margin-left:3px"></span>`
        : `<span style="width:12px;height:12px;border-radius:999px;border:2px solid var(--violet-soft);margin-left:3px"></span>`;
      return `<li style="display:grid;grid-template-columns:22px 54px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;${state === "done" ? "color:var(--faint)" : ""}">
        ${mark}<span class="small" style="font-weight:${state === "now" ? 700 : 600};color:${state === "now" ? "var(--violet)" : "var(--muted-2)"}">${r}</span>
        <span style="font-weight:${state === "now" ? 700 : 400}">${esc(t)}</span></li>`;
    }).join("");

    $("#view-home").innerHTML = `<section class="hero">${hero}</section>${schedule}
      <section class="card"><h2 class="card-title" style="margin-bottom:6px">수습 5주 과정</h2>
        <ol style="list-style:none;margin:0;padding:0">${list}</ol></section>`;
  }

  // ---------- 섬김 (주일 · 사역) 공용 ----------
  // 공개 배치를 예배 단위로 묶음
  const groupLineup = (rows) => {
    const by = new Map();
    rows.forEach((r) => { const k = r.service_id || r.service_date; if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
    return [...by.values()].sort((a, b) => a[0].service_date.localeCompare(b[0].service_date) || hm(a[0].start_time).localeCompare(hm(b[0].start_time)));
  };
  const svcTitle = (r, multi) => r.ministry_id ? `${r.ministry_name}${multi && r.label ? " · " + r.label : ""}` : "주일";
  const svcTime = (r) => r.ministry_id ? timeRange(r.start_time, r.end_time) : timeRange(...sunTime(r, ST));
  async function satRows(sundays) {
    if (!sundays.length) return [];
    const { data } = await sb.from("team_meetings").select("meeting_date, practice_start, practice_end").in("meeting_date", sundays.map((d) => addDays(d, -1)));
    return data || [];
  }

  // ---------- 멤버 홈 ----------
  async function renderMemberHome() {
    const today = todayISO();
    const monthStart = today.slice(0, 8) + "01";
    const [lu, meet, banners, prs] = await Promise.all([
      sb.from("published_lineups").select("*").gte("service_date", monthStart).order("service_date"),
      meetingCard(),
      respondBanners(),
      sb.from("ministry_practices").select("ministry_id, practice_date, start_time, end_time").gte("practice_date", today).order("practice_date"),
    ]);
    const rows = lu.data || [];
    const mine = rows.filter((r) => r.member_id === me.id);
    const roleChip = (r) => r.is_singer_leader ? "싱어 리더" : r.is_band_master ? "밴드 마스터" : "";
    const groups = groupLineup(rows);
    const multiOf = (r) => groups.filter((g) => g[0].ministry_id && g[0].ministry_id === r.ministry_id).length > 1;
    const sats = await satRows([...new Set(mine.filter((r) => !r.ministry_id).map((r) => r.service_date))]);

    const next = mine.find((r) => r.service_date >= today);
    let hero;
    if (next) {
      const same = rows.filter((r) => (r.service_id || r.service_date) === (next.service_id || next.service_date));
      const lead = same.find((r) => r.position_code === "leader");
      const bm = same.find((r) => r.is_band_master);
      const role = roleChip(next);
      const pills = [];
      if (next.ministry_id) {
        const p = (prs.data || []).find((x) => x.ministry_id === next.ministry_id);
        if (p) pills.push(`연습 ${mdw(p.practice_date)} ${hm(p.start_time)}`);
      } else {
        const sat = addDays(next.service_date, -1), sr = sats.find((x) => x.meeting_date === sat);
        pills.push(`토요 연습 ${md(sat)} ${hm(satTime(sr, ST)[0])}`);
      }
      if (lead || bm) pills.push([lead && "인도 " + esc(lead.member_name), bm && "밴마 " + esc(bm.member_name)].filter(Boolean).join(" · "));
      hero = `<section class="hero"><p class="eyebrow">${next.service_date <= addDays(today, 7) ? "이번 주" : "다음"} 나의 섬김</p>
        <div style="display:flex;flex-direction:column;gap:4px"><span class="big">${fmtDate(next.service_date, { month: "long", day: "numeric" })} ${esc(svcTitle(next, multiOf(next)))}</span>
          <span style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600">${esc(next.position_name)} · ${svcTime(next)}
            ${role ? `<span class="chip" style="background:#fff;color:var(--violet)">${role}</span>` : ""}</span></div>
        <div class="pills">${pills.map((p) => `<span>${p}</span>`).join("")}</div></section>`;
    } else {
      hero = `<section class="card bordered"><b style="font-size:17px">다가오는 섬김이 아직 없어요</b>
        <p class="muted small" style="margin:4px 0 0">배치표가 확정되면 여기에 보여요.</p></section>`;
    }

    const thisMonth = mine.filter((r) => r.service_date.slice(0, 7) === today.slice(0, 7));
    const monthCard = `<section class="card"><div class="card-head"><h2 class="card-title">${+today.slice(5, 7)}월 섬김 일정</h2></div>
      ${thisMonth.length ? thisMonth.map((r) => { const on = r === next; return `<div style="display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F1EAFB">
          <b style="color:${on ? "var(--violet)" : "var(--muted)"}">${md(r.service_date)}</b>
          <span style="font-weight:${on ? 700 : 400}">${r.ministry_id ? `<span class="chip chip-violet" style="margin-right:4px">${esc(svcTitle(r, multiOf(r)))}</span>` : ""}${esc(r.position_name)}</span>
          ${roleChip(r) ? `<span class="chip chip-violet">${roleChip(r)}</span>` : "<span></span>"}</div>`; }).join("")
        : `<p class="muted small" style="margin:0">이번 달 확정된 배치가 아직 없어요.</p>`}</section>`;

    $("#view-home").innerHTML = banners + hero + meet + monthCard;
  }

  // ---------- 섬김 응답: 데이터 ----------
  async function openMonths() {
    const { data } = await sb.from("availability_months").select("*").eq("is_open", true)
      .gte("month", monthOf(todayISO())).order("month");
    return data || [];
  }
  function slotsOf(month) {
    return sundaysOf(month).flatMap((sun) => [
      { date: addDays(sun, -1), kind: "sat_practice", sun },
      { date: sun, kind: "sunday", sun },
    ]);
  }
  async function myAnswers(month) {
    const slots = slotsOf(month);
    const { data } = await sb.from("availability").select("date, kind, available").eq("member_id", me.id)
      .gte("date", slots[0].date).lte("date", slots[slots.length - 1].date);
    return data || [];
  }
  // 사역: 나에게 해당하는 것만 (대상 · 아직 지나지 않은 것)
  async function loadMinistries() {
    const today = todayISO();
    const [mi, tg, av, pa, po] = await Promise.all([
      sb.from("ministries").select("*, services(id, service_date, label, start_time, end_time, sort_order), ministry_practices(*)"),
      sb.from("ministry_targets").select("ministry_id").eq("member_id", me.id),
      sb.from("ministry_availability").select("service_id, available").eq("member_id", me.id),
      sb.from("practice_answers").select("practice_id, available").eq("member_id", me.id),
      sb.from("ministry_poll").select("ministry_id, slots").eq("member_id", me.id),
    ]);
    if (mi.error) return { list: [], av: [], pa: [], po: [] };
    const mine = new Set((tg.data || []).map((t) => t.ministry_id));
    const list = (mi.data || []).filter((m) => (m.target_mode === "all" || mine.has(m.id)) && m.services.some((s) => s.service_date >= today))
      .map((m) => ({ ...m, svs: m.services.slice().sort((a, b) => a.service_date.localeCompare(b.service_date) || a.sort_order - b.sort_order),
        prs: m.ministry_practices.slice().sort((a, b) => a.practice_date.localeCompare(b.practice_date)) }));
    return { list, av: av.data || [], pa: pa.data || [], po: po.data || [] };
  }
  const myAvail = (D, sid) => D.av.find((a) => a.service_id === sid)?.available;
  const myPract = (D, pid) => D.pa.find((a) => a.practice_id === pid)?.available;
  const pollable = (D, m) => m.practice_mode === "poll" && m.poll_open && m.svs.some((s) => myAvail(D, s.id) === true);
  // 사역 한 개에서 내가 답할 칸 수 / 답한 칸 수 (예배 + 정해진 연습)
  const minCount = (D, m) => {
    const fixed = m.practice_mode === "fixed" ? m.prs.filter((p) => p.practice_date >= todayISO()) : [];
    const total = m.svs.length + fixed.length;
    const done = m.svs.filter((s) => myAvail(D, s.id) !== undefined).length + fixed.filter((p) => myPract(D, p.id) !== undefined).length;
    return { total, done };
  };

  async function respondBanners() {
    const [months, D] = await Promise.all([openMonths(), loadMinistries()]);
    const out = [];
    for (const m of months) {
      const mins = D.list.filter((x) => x.response_mode === "monthly" && x.svs.some((s) => monthOf(s.service_date) === m.month));
      const total = slotsOf(m.month).length + mins.reduce((n, x) => n + minCount(D, x).total, 0);
      const done = (await myAnswers(m.month)).length + mins.reduce((n, x) => n + minCount(D, x).done, 0);
      if (done < total) out.push(banner(`${monthLabel(m.month)} 섬김 응답을 받고 있어요`, `${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}${done ? `${total - done}개 남았어요` : "아직 응답 전"}`, m.deadline, `month:${m.month}`));
    }
    D.list.filter((x) => x.response_mode === "separate" && x.response_open).forEach((x) => {
      const c = minCount(D, x);
      if (c.done < c.total) out.push(banner(`${x.name} 섬김 응답`, `${x.response_deadline ? fmtDate(x.response_deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}${x.svs.length > 1 ? `예배 ${x.svs.length}개` : mdw(x.svs[0].service_date)}`, x.response_deadline, `min:${x.id}`));
    });
    D.list.filter((x) => pollable(D, x) && !D.po.some((p) => p.ministry_id === x.id)).forEach((x) =>
      out.push(banner(`${x.name} 연습 시간을 골라 주세요`, `${x.poll_deadline ? fmtDate(x.poll_deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}가능한 칸만 칠하기`, x.poll_deadline, `poll:${x.id}`)));
    return out.join("");
    function banner(t, sub, dl, key) {
      return `<a class="notice-link" href="#respond" onclick="respondKey='${key}'">
        <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(t)}</b><span class="muted small">${sub}</span></span>
        ${dl ? `<span class="chip chip-solid" style="border-radius:999px;padding:6px 12px">${dday(dl)}</span>` : ""}</a>`;
    }
  }

  // ---------- 섬김 응답 화면 ----------
  var respondKey = null;
  let paint = null;   // 연습 시간 칠하기 상태
  async function renderRespond() {
    const v = $("#view-respond");
    const [months, D] = await Promise.all([openMonths(), loadMinistries()]);
    const items = [
      ...months.map((m) => ({ key: `month:${m.month}`, title: `${monthLabel(m.month)} 섬김`, sub: m.deadline ? `${md(m.deadline)}까지` : "응답 받는 중" })),
      ...D.list.filter((x) => x.response_mode === "separate" && x.response_open).map((x) => ({ key: `min:${x.id}`, title: x.name, sub: x.response_deadline ? `${md(x.response_deadline)}까지` : "섬김 응답" })),
      ...D.list.filter((x) => pollable(D, x)).map((x) => ({ key: `poll:${x.id}`, title: `${x.name} 연습`, sub: "가능 시간" })),
    ];
    if (!items.length) {
      v.innerHTML = `<h1 style="font-size:22px;font-weight:800">섬김 응답</h1>
        <div class="empty">지금은 응답 받는 일정이 없어요.<br>리더가 응답을 열면 여기에 보여요.</div>`;
      return;
    }
    if (!items.some((i) => i.key === respondKey)) respondKey = items[0].key;
    const pick = items.length > 1 ? `<div class="resp-pick" id="respPick">${items.map((i) => `<button type="button" data-key="${i.key}" aria-pressed="${i.key === respondKey}"><b>${esc(i.title)}</b><span>${esc(i.sub)}</span></button>`).join("")}</div>` : "";
    const [kind, id] = respondKey.split(":");
    if (kind === "month") await drawMonth(v, months.find((m) => m.month === id), D, pick);
    if (kind === "min") drawMinistry(v, D.list.find((x) => x.id === id), D, pick);
    if (kind === "poll") drawPoll(v, D.list.find((x) => x.id === id), D, pick);
    $("#respPick")?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { respondKey = b.dataset.key; renderRespond(); } });
  }

  // 가능/불가 한 줄
  const ansRow = (attrs, title, sub, x) => `<div class="ans-row ansrow" ${attrs}>
      <span style="display:flex;flex-direction:column"><b>${title}</b><span class="muted small">${sub}</span></span>
      <button type="button" class="ans" data-v="true" aria-pressed="${x === true}">가능</button>
      <button type="button" class="ans" data-v="false" aria-pressed="${x === false}">불가</button></div>`;
  // 사역 예배·연습 줄
  const minRows = (D, m) => `${m.svs.map((s) => ansRow(`data-sid="${s.id}"`, esc(m.svs.length > 1 ? s.label || m.name : m.name),
      `${fmtDate(s.service_date, { month: "long", day: "numeric", weekday: "short" })} ${timeRange(s.start_time, s.end_time)}`, myAvail(D, s.id))).join("")}
    ${m.practice_mode === "fixed" ? m.prs.filter((p) => p.practice_date >= todayISO()).map((p) => ansRow(`data-pid="${p.id}"`, "사전 연습",
      `${fmtDate(p.practice_date, { month: "long", day: "numeric", weekday: "short" })} ${timeRange(p.start_time, p.end_time)}`, myPract(D, p.id))).join("") : ""}`;
  const progress = (done, total) => `<div style="display:flex;justify-content:space-between;align-items:baseline" class="prog-head"><span></span>
      <b class="small" style="color:var(--violet)" id="progLabel">${done} / ${total} 응답</b></div>
    <div style="height:6px;border-radius:999px;background:var(--tint-2);overflow:hidden"><div id="progBar" style="height:6px;border-radius:999px;background:var(--violet);width:${total ? Math.round(done / total * 100) : 0}%"></div></div>`;

  async function bindAnswers(v, total, monthSave) {
    const refresh = () => {
      const n = $$(".ans-row", v).filter((r) => r.querySelector('[aria-pressed="true"]')).length;
      $("#progLabel").textContent = `${n} / ${total} 응답`;
      $("#progBar").style.width = Math.round(n / total * 100) + "%";
      if (n === total) toast("모두 응답했어요");
    };
    v.querySelectorAll(".ans-row").forEach((row) => row.addEventListener("click", async (e) => {
      const b = e.target.closest(".ans"); if (!b) return;
      const val = b.dataset.v === "true";
      let error;
      if (row.dataset.sid) ({ error } = await sb.from("ministry_availability").upsert({ service_id: row.dataset.sid, member_id: me.id, available: val }));
      else if (row.dataset.pid) ({ error } = await sb.from("practice_answers").upsert({ practice_id: row.dataset.pid, member_id: me.id, available: val }));
      else ({ error } = await monthSave([{ date: row.dataset.date, kind: row.dataset.kind, available: val }]));
      if (error) { toast("저장하지 못했어요. 응답이 마감됐는지 확인해 주세요"); return renderRespond(); }
      row.querySelectorAll(".ans").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      refresh();
    }));
  }

  async function drawMonth(v, m, D, pick) {
    const slots = slotsOf(m.month);
    const ans = await myAnswers(m.month);
    const sats = await satRows(sundaysOf(m.month));
    const { data: noteRow } = await sb.from("availability_notes").select("note").eq("member_id", me.id).eq("month", m.month).maybeSingle();
    const val = (s) => ans.find((x) => x.date === s.date && x.kind === s.kind)?.available;
    const mins = D.list.filter((x) => x.response_mode === "monthly" && x.svs.some((s) => monthOf(s.service_date) === m.month));
    const total = slots.length + mins.reduce((n, x) => n + minCount(D, x).total, 0);
    const done = slots.filter((s) => val(s) !== undefined).length + mins.reduce((n, x) => n + minCount(D, x).done, 0);
    const save = (rows) => sb.from("availability").upsert(rows.map((r) => ({ member_id: me.id, ...r })));

    v.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${pick}
        <h1 style="font-size:22px;font-weight:800">${monthLabel(m.month)} 섬김 응답</h1>
        <div class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px 18px">
          <span class="muted small">${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지" : "마감일 미정"}</span>
          ${progress(done, total)}
          <button type="button" class="btn btn-soft" id="allYes">토요 연습·주일 전부 가능으로 채우기</button>
        </div>
      </div>
      ${sundaysOf(m.month).map((sun) => `<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:16px 18px">
        <h2 style="font-size:15px;font-weight:800">${fmtDate(sun, { month: "long", day: "numeric" })} 주일 주간</h2>
        ${slots.filter((s) => s.sun === sun).map((s) => ansRow(`data-date="${s.date}" data-kind="${s.kind}"`, s.kind === "sunday" ? "주일 예배" : "토요 연습",
          `${fmtDate(s.date, { month: "long", day: "numeric", weekday: "short" })} ${s.kind === "sunday" ? hm(ST.sunday_start) : hm(satTime(sats.find((x) => x.meeting_date === s.date), ST)[0])}`, val(s))).join("")}</section>`).join("")}
      ${mins.map((x) => `<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid var(--violet-soft)">
        <h2 style="font-size:15px;font-weight:800">${esc(x.name)} <span class="chip chip-violet">사역</span></h2>
        ${minRows(D, x)}</section>`).join("")}
      <label class="field" style="font-size:15px;font-weight:700">리더에게 전할 말
        <span class="hint">예: 11/15는 오후만 가능해요</span>
        <textarea id="respNote" maxlength="300" style="min-height:80px">${esc(noteRow?.note || "")}</textarea></label>
      <p class="muted small" style="margin:0;text-align:center">누르는 즉시 저장돼요. 마감 전까지 언제든 바꿀 수 있어요.</p>`;
    bindAnswers(v, total, save);
    $("#allYes").addEventListener("click", async () => {
      const { error } = await save(slots.map((s) => ({ date: s.date, kind: s.kind, available: true })));
      if (error) return toast("저장하지 못했어요. 응답이 마감됐는지 확인해 주세요");
      renderRespond();
    });
    $("#respNote").addEventListener("change", async (e) => {
      const note = e.target.value.trim();
      const q = note
        ? sb.from("availability_notes").upsert({ member_id: me.id, month: m.month, note })
        : sb.from("availability_notes").delete().eq("member_id", me.id).eq("month", m.month);
      const { error } = await q;
      toast(error ? "저장하지 못했어요" : "리더에게 전할 말을 저장했어요");
    });
  }

  function drawMinistry(v, m, D, pick) {
    const c = minCount(D, m);
    const last = m.svs[m.svs.length - 1].service_date;
    const span = m.svs.length > 1 ? `${fmtDate(m.svs[0].service_date, { month: "long", day: "numeric", weekday: "short" })} – ${+last.slice(8)}일 (${["주일", "월", "화", "수", "목", "금", "토"][dowOf(last)]})` : "";
    const fixed = m.prs.filter((p) => p.practice_date >= todayISO());
    v.innerHTML = `${pick}
      <h1 style="font-size:22px;font-weight:800">${esc(m.name)} 섬김 응답</h1>
      <div class="card" style="display:flex;flex-direction:column;gap:8px;padding:14px 18px">
        <span class="muted small">${span ? span + " · " : ""}${m.response_deadline ? fmtDate(m.response_deadline, { month: "long", day: "numeric" }) + "까지" : "마감일 미정"}</span>
        ${progress(c.done, c.total)}
        ${m.practice_mode === "poll" && fixed.length ? `<span class="small"><b>연습</b> ${fixed.map((p) => `${mdw(p.practice_date)} ${timeRange(p.start_time, p.end_time)}`).join(", ")} <span class="chip chip-ok">확정</span></span>` : ""}
        ${m.practice_mode === "poll" && !fixed.length ? `<span class="small muted">연습 시간은 '가능'으로 답한 분께 따로 여쭤봐요.</span>` : ""}
      </div>
      <section class="card" style="display:flex;flex-direction:column;gap:12px">${minRows(D, m)}</section>
      <p class="muted small" style="margin:0;text-align:center">누르는 즉시 저장돼요. 마감 전까지 바꿀 수 있어요.</p>`;
    bindAnswers(v, c.total, null);
  }

  // 연습 가능 시간 칠하기 (30분 칸)
  function drawPoll(v, m, D, pick) {
    const days = []; for (let d = m.poll_from; d && d <= m.poll_to; d = addDays(d, 1)) days.push(d);
    const t0 = toMin(m.poll_day_start), t1 = toMin(m.poll_day_end);
    const times = []; for (let t = t0; t < t1; t += 30) times.push(fromMin(t));
    if (!paint || paint.id !== m.id) paint = { id: m.id, mode: "on", set: new Set(D.po.find((p) => p.ministry_id === m.id)?.slots || []), dirty: false };
    const mySvc = m.svs.filter((s) => myAvail(D, s.id) === true);
    const narrow = days.length > 7;
    const summary = () => {
      const byDay = days.map((d) => { const ts = times.filter((t) => paint.set.has(`${d} ${t}`)); if (!ts.length) return null;
        // 이어진 칸끼리 묶기
        const parts = []; let s = null, prev = null;
        ts.forEach((t) => { if (s && toMin(t) === toMin(prev) + 30) prev = t; else { if (s) parts.push([s, prev]); s = t; prev = t; } });
        parts.push([s, prev]);
        return `${md(d)} ${parts.map(([a, b]) => `${a}–${fromMin(toMin(b) + 30)}`).join(", ")}`; }).filter(Boolean);
      return byDay.length ? byDay.join(" · ") : "아직 칠한 시간이 없어요";
    };
    v.innerHTML = `${pick}
      <h1 style="font-size:22px;font-weight:800">${esc(m.name)} 연습 시간</h1>
      <div class="card" style="display:flex;flex-direction:column;gap:6px;padding:14px 18px">
        <span class="small"><b>본 섬김</b> ${mySvc.map((s) => `${mdw(s.service_date)} ${hm(s.start_time)}`).join(", ")} <span class="chip chip-ok">가능으로 응답</span></span>
        <span class="muted small">연습은 ${m.practice_minutes % 60 ? `${Math.floor(m.practice_minutes / 60)}시간 ${m.practice_minutes % 60}분` : `${m.practice_minutes / 60}시간`}이에요. 되는 시간을 손가락으로 쓸어서 칠해 주세요.${m.poll_deadline ? ` ${fmtDate(m.poll_deadline, { month: "long", day: "numeric", weekday: "short" })}까지.` : ""}</span>
      </div>
      <div class="seg" id="pMode"><button type="button" data-v="on" aria-pressed="${paint.mode === "on"}">칠하기</button><button type="button" data-v="off" aria-pressed="${paint.mode === "off"}">지우기</button>
        <button type="button" id="pCopy">같은 시간 매일 복사</button><button type="button" id="pClear">모두 지우기</button></div>
      <section class="card" style="padding:14px 10px;overflow-x:auto">
        <div class="pick" id="pGrid" style="grid-template-columns:40px repeat(${days.length}, minmax(${narrow ? 30 : 0}px,1fr));${narrow ? `min-width:${40 + days.length * 33}px` : ""}">
          <span></span>${days.map((d) => `<span class="h">${+d.slice(8)}\n${["주일", "월", "화", "수", "목", "금", "토"][dowOf(d)]}</span>`).join("")}
          ${times.map((t) => `<span class="t">${t.endsWith(":00") ? t : ""}</span>${days.map((d) => `<span class="c ${paint.set.has(`${d} ${t}`) ? "on" : ""}" data-k="${d} ${t}"></span>`).join("")}`).join("")}
        </div>
        <div class="row small muted" style="justify-content:center;margin-top:10px"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--violet-mid);vertical-align:-1px"></i> 가능</span>
          <span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#fff;border:1px solid #E7DFF3;vertical-align:-1px"></i> 안 됨</span></div>
      </section>
      <div class="note-box small" id="pSum">칠한 시간: ${esc(summary())}</div>
      <button type="button" class="btn btn-primary btn-block" id="pSave">저장</button>`;

    const grid = $("#pGrid");
    let dragging = false;
    const apply = (cell) => {
      if (!cell?.dataset?.k) return;
      const on = paint.mode === "on";
      if (paint.set.has(cell.dataset.k) === on) return;
      on ? paint.set.add(cell.dataset.k) : paint.set.delete(cell.dataset.k);
      cell.classList.toggle("on", on); paint.dirty = true;
      $("#pSum").textContent = "칠한 시간: " + summary();
    };
    grid.addEventListener("pointerdown", (e) => {
      const c = e.target.closest(".c"); if (!c) return;
      e.preventDefault(); dragging = true; grid.setPointerCapture?.(e.pointerId); apply(c);
    });
    grid.addEventListener("pointermove", (e) => { if (dragging) apply(document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".c")); });
    const stop = () => { dragging = false; };
    grid.addEventListener("pointerup", stop); grid.addEventListener("pointercancel", stop);
    $("#pMode").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-v]"); if (!b) return;
      paint.mode = b.dataset.v; $$("#pMode button[data-v]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    });
    $("#pCopy").onclick = () => {
      const best = days.map((d) => ({ d, ts: times.filter((t) => paint.set.has(`${d} ${t}`)) })).sort((a, b) => b.ts.length - a.ts.length)[0];
      if (!best?.ts.length) return toast("먼저 하루를 칠해 주세요");
      days.forEach((d) => best.ts.forEach((t) => paint.set.add(`${d} ${t}`)));
      paint.dirty = true; drawPoll(v, m, D, pick); toast(`${md(best.d)}에 칠한 시간을 모든 날에 복사했어요`);
    };
    $("#pClear").onclick = () => { paint.set.clear(); paint.dirty = true; drawPoll(v, m, D, pick); };
    $("#pSave").onclick = async () => {
      const { error } = await sb.from("ministry_poll").upsert({ ministry_id: m.id, member_id: me.id, slots: [...paint.set].sort() });
      if (error) return toast("저장하지 못했어요. 취합이 마감됐는지 확인해 주세요");
      paint.dirty = false; toast("연습 가능 시간을 저장했어요");
    };
  }

  // ---------- 배치표 ----------
  let lineupMonth = null;
  async function renderLineup() {
    const v = $("#view-lineup");
    if (!lineupMonth) lineupMonth = monthOf(todayISO());
    const { data } = await sb.from("published_lineups").select("*")
      .gte("service_date", lineupMonth).lt("service_date", addMonths(lineupMonth, 1))
      .order("service_date").order("sort_order").order("slot");
    const rows = data || [];
    const groups = groupLineup(rows);
    const sats = await satRows([...new Set(rows.filter((r) => !r.ministry_id).map((r) => r.service_date))]);
    const multi = (r) => groups.filter((g) => g[0].ministry_id && g[0].ministry_id === r.ministry_id).length > 1;
    const role = (r) => r.is_singer_leader ? "싱어 리더" : r.is_band_master ? "밴드 마스터" : "";
    v.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button type="button" class="btn btn-ghost btn-sm" id="prevM" aria-label="이전 달">이전 달</button>
        <h1 style="font-size:22px;font-weight:800">${monthLabel(lineupMonth)} 배치표</h1>
        <button type="button" class="btn btn-ghost btn-sm" id="nextM" aria-label="다음 달">다음 달</button>
      </div>
      ${groups.length ? groups.map((list) => {
        const h = list[0], d = h.service_date;
        const mine = list.some((r) => r.member_id === me.id);
        const sub = h.ministry_id ? `${mdw(d)} · ${svcTime(h)}` : `${svcTime(h).split("–")[0]} · 토요 연습 ${md(addDays(d, -1))} ${hm(satTime(sats.find((x) => x.meeting_date === addDays(d, -1)), ST)[0])}`;
        return `<section class="card ${mine ? "bordered" : ""}" style="display:flex;flex-direction:column;gap:6px;${mine ? "border-color:var(--violet-soft)" : ""}">
          <div class="card-head" style="margin-bottom:4px;flex-wrap:wrap"><h2 class="card-title">${h.ministry_id ? `${esc(svcTitle(h, multi(h)))} <span class="chip chip-violet">사역</span>` : `${fmtDate(d, { month: "long", day: "numeric" })} 주일`}</h2>
            <span class="muted small">${sub}</span></div>
          ${h.note ? `<p class="muted small" style="margin:0 0 4px">${esc(h.note)}</p>` : ""}
          ${list.map((r) => `<div style="display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;${r.member_id === me.id ? "background:var(--tint);" : ""}">
            <span class="muted small" style="font-weight:600">${esc(r.position_name)}</span>
            <span style="font-weight:${r.member_id === me.id ? 800 : 500};${r.member_id === me.id ? "color:var(--violet)" : ""}">${esc(r.member_name)}${r.member_id === me.id ? " (나)" : ""}</span>
            ${role(r) ? `<span class="chip chip-violet">${role(r)}</span>` : "<span></span>"}</div>`).join("")}
        </section>`;
      }).join("") : `<div class="empty">${monthLabel(lineupMonth)} 확정된 배치표가 아직 없어요.</div>`}`;
    $("#prevM").onclick = () => { lineupMonth = addMonths(lineupMonth, -1); renderLineup(); };
    $("#nextM").onclick = () => { lineupMonth = addMonths(lineupMonth, 1); renderLineup(); };
  }

  // ---------- 내 정보 ----------
  function renderInfo() {
    $("#posInfo").innerHTML = `<dt>주 포지션</dt><dd>${esc(positionName(me.main_position))}</dd>
      ${extras.length ? `<dt>추가 포지션</dt><dd>${extras.map((e) => esc(positionName(e.position_code))).join(", ")}</dd>` : ""}
      <dt>구분</dt><dd>${me.status === "trainee" ? "수습" : "정식 팀원"}</dd>`;
    if (!app) { $("#appCard").classList.add("hidden"); return; }
    $("#appInfo").innerHTML = `<dt>이름</dt><dd>${esc(app.name)}</dd><dt>연락처</dt><dd>${esc(app.phone)}</dd>
      <dt>이메일</dt><dd>${esc(app.email)}</dd><dt>순모임</dt><dd>${esc(app.small_group) || "—"}</dd>
      <dt>지원 포지션</dt><dd>${esc(positionName(app.applied_position))}</dd>
      <dt>지원 동기</dt><dd>${esc(app.motivation) || "—"}</dd><dt>이루고 싶은 것</dt><dd>${esc(app.goal) || "—"}</dd>`;
    $("#pledgeTitle").textContent = app.pledge_title;
    $("#pledge").textContent = app.pledge_content;
    $("#pledgedAt").textContent = `${fmtDate(app.pledged_at, { year: "numeric", month: "long", day: "numeric" })}에 서약했어요.`;
  }
</script>
</body>
</html>
