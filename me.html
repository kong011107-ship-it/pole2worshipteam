<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#410A85">
  <title>Pole2 찬양팀</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css?v=10">
</head>
<body>
<div class="m-wrap">
  <header class="topbar">
    <img src="assets/logo-violet.png" alt="Pole2">
    <span class="who"><span id="whoName"></span><span id="whoBadge"></span></span>
  </header>

  <main class="m-main" id="view-home"></main>

  <main class="m-main hidden" id="view-respond"></main>
  <main class="m-main hidden" id="view-lineup"></main>

  <main class="m-main hidden" id="view-info">
    <section class="card">
      <div class="card-head"><h2 class="card-title">내 포지션</h2></div>
      <dl class="kv" id="posInfo"></dl>
    </section>
    <section class="card" id="appCard">
      <div class="card-head"><h2 class="card-title">내 지원서와 서약</h2></div>
      <p class="muted small" style="margin: -4px 0 12px">지원할 때 작성한 내용이에요. 고칠 부분이 있으면 리더에게 말씀해 주세요.</p>
      <dl class="kv" id="appInfo" style="margin-bottom: 14px"></dl>
      <details open><summary style="cursor: pointer; font-weight: 700; color: var(--violet); margin-bottom: 8px" id="pledgeTitle"></summary>
        <div class="pledge-box" id="pledge"></div>
        <p class="muted small" id="pledgedAt" style="margin: 8px 0 0"></p>
      </details>
    </section>
    <button type="button" class="btn btn-ghost" onclick="logout()">로그아웃</button>
  </main>
</div>

<nav class="tabbar" aria-label="하단 메뉴"><div class="tabbar-inner" id="tabbar"></div></nav>

<script src="assets/config.js?v=10"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/common.js?v=10"></script>
<script>
  let ctx, me, app, extras = [];

  (async function init() {
    ctx = await requireMember();
    if (!ctx) return;
    me = ctx.me;
    await loadPositions();
    $("#whoName").textContent = `${me.name}님`;
    $("#whoBadge").innerHTML = me.status === "trainee" ? `<span class="chip chip-violet">수습</span>`
      : me.role === "admin" ? `<a href="admin.html" class="chip chip-solid" style="text-decoration:none">관리자 화면</a>` : "";

    const [a, x] = await Promise.all([
      sb.from("applications").select("*").eq("user_id", me.id).maybeSingle(),
      sb.from("member_extra_positions").select("position_code").eq("member_id", me.id),
    ]);
    app = a.data; extras = x.data || [];

    renderTabbar();
    renderInfo();
    if (me.status === "trainee") {
      const { data: pps } = await sb.rpc("my_trainee_postpones");
      renderTraineeHome(pps || []);
      $("#view-home").insertAdjacentHTML("beforeend", await meetingCard());
    } else await renderMemberHome();
    showView();
  })();

  // ---------- 탭 ----------
  function renderTabbar() {
    const tabs = me.status === "trainee"
      ? [["home", "홈", ICON.home], ["info", "내 정보", ICON.user]]
      : [["home", "홈", ICON.home], ["respond", "섬김 응답", ICON.check], ["lineup", "배치표", ICON.table], ["info", "내 정보", ICON.user]];
    $("#tabbar").innerHTML = tabs.map(([id, label, icon]) =>
      `<button type="button" data-tab="${id}">${icon}${label}</button>`).join("");
    $("#tabbar").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (location.hash.slice(1) === b.dataset.tab) showView(); else location.hash = b.dataset.tab;
    });
  }
  function showView() {
    if (!me) return;   // 아직 불러오는 중이면 init이 끝난 뒤 다시 호출됨
    const allowed = me.status === "trainee" ? ["home", "info"] : ["home", "respond", "lineup", "info"];
    const h = location.hash.slice(1);
    const v = allowed.includes(h) ? h : "home";
    ["home", "respond", "lineup", "info"].forEach((k) => $(`#view-${k}`).classList.toggle("hidden", v !== k));
    $$("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === v));
    if (v === "respond") renderRespond();
    if (v === "lineup") renderLineup();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", showView);

  // ---------- 이번 주 팀모임 + 최근 출석 ----------
  async function meetingCard() {
    const sat = upcomingSaturday();
    const [tm, at] = await Promise.all([
      sb.from("team_meetings").select("meeting_date, meeting_status").eq("meeting_date", sat).maybeSingle(),
      sb.from("attendance").select("status, kind, team_meetings(meeting_date, meeting_status)").eq("member_id", me.id).eq("kind", "meeting"),
    ]);
    const ms = tm.data?.meeting_status || "tbd";
    const chip = { yes: "chip-ok", no: "chip-gray", tbd: "chip-mid" }[ms];
    const sub = { yes: "토요 연습 후 함께 모여요", no: "이번 주는 팀모임이 없어요", tbd: "정해지면 여기에 보여요" }[ms];
    const recs = (at.data || []).filter((r) => r.team_meetings && r.team_meetings.meeting_status === "yes")
      .sort((a, b) => b.team_meetings.meeting_date.localeCompare(a.team_meetings.meeting_date)).slice(0, 5).reverse();
    const attended = recs.filter((r) => r.status === "present" || r.status === "late").length;
    const color = (s) => s === "present" ? "var(--violet)" : s === "late" ? "#D9A066" : s === "excused" ? "#C3BACF" : "#D8D2E3";
    return `<section class="card" id="meetCard" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">이번 주 팀모임 · ${fmtDate(sat, { month: "long", day: "numeric", weekday: "short" })}</span>
          <b style="font-size:17px">${sub}</b></span>
        <span class="chip ${chip}" style="font-size:14px;padding:6px 12px;border-radius:999px">${MEETING[ms]}</span>
      </div>
      ${recs.length ? `<div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="muted small">최근 팀모임 출석</span><b>${recs.length}번 중 ${attended}번</b></span>
        <span style="display:flex;gap:6px" role="img" aria-label="최근 ${recs.length}번 중 ${attended}번 출석">${recs.map((r) =>
          `<span title="${fmtDate(r.team_meetings.meeting_date)} ${ATT[r.status]}" style="width:10px;height:10px;border-radius:999px;background:${color(r.status)}"></span>`).join("")}</span></div>` : ""}
    </section>`;
  }

  // ---------- 수습생 홈 ----------
  function renderTraineeHome(pps) {
    const start = app?.trainee_start;
    const st = traineeState(start, pps), w = st.week;
    const cur = TRAINEE_WEEKS[Math.min(Math.max(w, 1), 5) - 1];
    let hero;
    if (!start || w === 0) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">수습을 곧 시작해요</span>
        <span class="sub">${start ? fmtDate(st.resume, { weekday: "short" }) + " 토요 연습부터 함께해요." : "시작일은 리더가 안내해 드려요."}</span>`;
    } else if (st.paused) {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차까지 완료</b></div>
        <span class="big">${st.nextWeek}주차가 미뤄졌어요</span>
        <span class="sub">${fmtDate(st.resume, { month: "long", day: "numeric", weekday: "short" })} 토요 연습부터 다시 함께해요.</span>
        <div class="weekbar" aria-label="5주 중 ${w}주 완료">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    } else if (w > 5) {
      hero = `<p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p>
        <span class="big">5주 과정을 마쳤어요</span>
        <span class="sub">리더십과 커피챗 후 정식 전환을 안내해 드려요.</span>`;
    } else {
      hero = `<div style="display:flex;justify-content:space-between;align-items:baseline">
          <p class="eyebrow">수습 · ${esc(positionName(me.main_position))}</p><b class="small">${w}주차 / 5주</b></div>
        <span class="big">${esc(cur.title)}</span>
        <span class="sub">${esc(cur.desc)}</span>
        <div class="weekbar" aria-label="5주 중 ${w}주차">${[1,2,3,4,5].map((i) => `<span class="${i <= w ? "on" : ""}"></span>`).join("")}</div>`;
    }

    let schedule = "";
    if (start && w >= 0 && w <= 5) {
      const n = st.paused ? st.nextWeek : Math.max(w, 1);
      const sat = traineeWeekSat(start, n, pps), sun = addDays(sat, 1);
      schedule = `<section class="card" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="card-title">${w === 0 ? "첫 주 일정" : st.paused ? `다시 시작하는 ${n}주차 일정` : "이번 주 일정"}</h2>
        ${row(md(sat), "토", "토요 팀 연습", n >= 3 ? TRAINEE_WEEKS[n - 1].desc : "연습을 함께 지켜보며 팀 문화에 적응해요")}
        ${row(md(sun), "주일", "오전 9시 세팅 참관", "예배 후 리더십과 나눔")}
      </section>`;
    }
    function row(d, day, t, s) {
      return `<div style="display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start">
        <span class="small" style="font-weight:700;color:var(--violet);background:var(--tint);border-radius:8px;padding:6px 0;text-align:center">${d}<br>${day}</span>
        <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(t)}</b><span class="muted small">${esc(s)}</span></span></div>`;
    }

    const steps = [[1, "1~2주", "참관 + 적응"], [3, "3주", "부담 적은 투입"], [4, "4주", "실전 연주 · 지정곡 1곡"], [5, "5주", "전환 면접 · 리더십과 커피챗"]];
    const list = steps.map(([n, r, t]) => {
      const end = n === 1 ? 2 : n;
      const state = w > end ? "done" : w >= n ? "now" : "todo";
      const mark = state === "done"
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--violet-mid)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
        : state === "now" ? `<span role="img" aria-label="진행 중" style="width:12px;height:12px;border-radius:999px;background:var(--violet);margin-left:3px"></span>`
        : `<span style="width:12px;height:12px;border-radius:999px;border:2px solid var(--violet-soft);margin-left:3px"></span>`;
      return `<li style="display:grid;grid-template-columns:22px 54px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;${state === "done" ? "color:var(--faint)" : ""}">
        ${mark}<span class="small" style="font-weight:${state === "now" ? 700 : 600};color:${state === "now" ? "var(--violet)" : "var(--muted-2)"}">${r}</span>
        <span style="font-weight:${state === "now" ? 700 : 400}">${esc(t)}</span></li>`;
    }).join("");

    $("#view-home").innerHTML = `<section class="hero">${hero}</section>${schedule}
      <section class="card"><h2 class="card-title" style="margin-bottom:6px">수습 5주 과정</h2>
        <ol style="list-style:none;margin:0;padding:0">${list}</ol></section>`;
  }

  // ---------- 멤버 홈 ----------
  async function renderMemberHome() {
    const today = todayISO();
    const monthStart = today.slice(0, 8) + "01";
    const [lu, meet] = await Promise.all([
      sb.from("published_lineups").select("*").gte("service_date", monthStart).order("service_date"),
      meetingCard(),
    ]);
    const rows = lu.data || [];
    const mine = rows.filter((r) => r.member_id === me.id);
    const roleChip = (r) => r.is_singer_leader ? "싱어 리더" : r.is_band_master ? "밴드 마스터" : "";

    const next = mine.find((r) => r.service_date >= today);
    let hero;
    if (next) {
      const same = rows.filter((r) => r.service_date === next.service_date);
      const lead = same.find((r) => r.position_code === "leader");
      const bm = same.find((r) => r.is_band_master);
      const sat = addDays(next.service_date, -1);
      const role = roleChip(next);
      hero = `<section class="hero"><p class="eyebrow">${next.service_date <= addDays(today, 7) ? "이번 주" : "다음"} 나의 섬김</p>
        <div style="display:flex;flex-direction:column;gap:4px"><span class="big">${fmtDate(next.service_date, { month: "long", day: "numeric" })} 주일</span>
          <span style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600">${esc(next.position_name)}
            ${role ? `<span class="chip" style="background:#fff;color:var(--violet)">${role}</span>` : ""}</span></div>
        <div class="pills"><span>토요 연습 ${md(sat)}</span>${lead || bm ? `<span>${[lead && "인도 " + esc(lead.member_name), bm && "밴마 " + esc(bm.member_name)].filter(Boolean).join(" · ")}</span>` : ""}</div></section>`;
    } else {
      hero = `<section class="card bordered"><b style="font-size:17px">다가오는 섬김이 아직 없어요</b>
        <p class="muted small" style="margin:4px 0 0">배치표가 확정되면 여기에 보여요.</p></section>`;
    }

    const thisMonth = mine.filter((r) => r.service_date.slice(0, 7) === today.slice(0, 7));
    const monthCard = `<section class="card"><div class="card-head"><h2 class="card-title">${+today.slice(5, 7)}월 섬김 일정</h2></div>
      ${thisMonth.length ? thisMonth.map((r) => `<div style="display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F1EAFB">
          <b style="color:${r.service_date === next?.service_date ? "var(--violet)" : "var(--muted)"}">${md(r.service_date)}</b>
          <span style="font-weight:${r.service_date === next?.service_date ? 700 : 400}">${esc(r.position_name)}</span>
          ${roleChip(r) ? `<span class="chip chip-violet">${roleChip(r)}</span>` : "<span></span>"}</div>`).join("")
        : `<p class="muted small" style="margin:0">이번 달 확정된 배치가 아직 없어요.</p>`}</section>`;

    $("#view-home").innerHTML = (await respondBanner()) + hero + meet + monthCard;
  }

  // ---------- 섬김 응답 ----------
  async function openMonths() {
    const { data } = await sb.from("availability_months").select("*").eq("is_open", true)
      .gte("month", monthOf(todayISO())).order("month");
    return data || [];
  }
  function slotsOf(month) {
    return sundaysOf(month).flatMap((sun) => [
      { date: addDays(sun, -1), kind: "sat_practice", sun },
      { date: sun, kind: "sunday", sun },
    ]);
  }
  async function myAnswers(month) {
    const slots = slotsOf(month);
    const { data } = await sb.from("availability").select("date, kind, available").eq("member_id", me.id)
      .gte("date", slots[0].date).lte("date", slots[slots.length - 1].date);
    return data || [];
  }
  async function respondBanner() {
    const months = await openMonths();
    for (const m of months) {
      const total = slotsOf(m.month).length, done = (await myAnswers(m.month)).length;
      if (done < total) return `<a class="notice-link" href="#respond">
        <span style="display:flex;flex-direction:column;gap:2px"><b>${monthLabel(m.month)} 섬김 응답을 받고 있어요</b>
          <span class="muted small">${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지 · " : ""}${done ? `${total - done}개 남았어요` : "아직 응답 전"}</span></span>
        ${m.deadline ? `<span class="chip chip-solid" style="border-radius:999px;padding:6px 12px">${dday(m.deadline)}</span>` : ""}</a>`;
    }
    return "";
  }

  let respondMonth = null;
  async function renderRespond() {
    const v = $("#view-respond");
    const months = await openMonths();
    if (!months.length) {
      v.innerHTML = `<h1 style="font-size:22px;font-weight:800">섬김 응답</h1>
        <div class="empty">지금은 응답 받는 달이 없어요.<br>리더가 응답을 열면 여기에 보여요.</div>`;
      return;
    }
    if (!months.some((m) => m.month === respondMonth)) respondMonth = months[0].month;
    const m = months.find((x) => x.month === respondMonth);
    const slots = slotsOf(m.month);
    const ans = await myAnswers(m.month);
    const { data: noteRow } = await sb.from("availability_notes").select("note").eq("member_id", me.id).eq("month", m.month).maybeSingle();
    const val = (s) => ans.find((x) => x.date === s.date && x.kind === s.kind)?.available;
    const done = slots.filter((s) => val(s) !== undefined).length;

    v.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <h1 style="font-size:22px;font-weight:800">${monthLabel(m.month)} 섬김 응답</h1>
        ${months.length > 1 ? `<div class="seg" id="monthPick">${months.map((x) => `<button type="button" data-m="${x.month}" aria-pressed="${x.month === m.month}">${monthLabel(x.month)}</button>`).join("")}</div>` : ""}
        <div class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px 18px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span class="muted small">${m.deadline ? fmtDate(m.deadline, { month: "long", day: "numeric", weekday: "short" }) + "까지" : "마감일 미정"}</span>
            <b class="small" style="color:var(--violet)" id="progLabel">${done} / ${slots.length} 응답</b></div>
          <div style="height:6px;border-radius:999px;background:var(--tint-2);overflow:hidden"><div id="progBar" style="height:6px;border-radius:999px;background:var(--violet);width:${Math.round(done / slots.length * 100)}%"></div></div>
          <button type="button" class="btn btn-soft" id="allYes">전부 가능으로 채우기</button>
        </div>
      </div>
      ${sundaysOf(m.month).map((sun) => `<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:16px 18px">
        <h2 style="font-size:15px;font-weight:800">${fmtDate(sun, { month: "long", day: "numeric" })} 주일 주간</h2>
        ${slots.filter((s) => s.sun === sun).map((s) => {
          const x = val(s);
          return `<div class="ans-row" data-date="${s.date}" data-kind="${s.kind}" style="display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:8px;align-items:center">
            <span style="display:flex;flex-direction:column"><b>${s.kind === "sunday" ? "주일 예배" : "토요 연습"}</b>
              <span class="muted small">${fmtDate(s.date, { month: "long", day: "numeric", weekday: "short" })}</span></span>
            <button type="button" class="ans" data-v="true" aria-pressed="${x === true}">가능</button>
            <button type="button" class="ans" data-v="false" aria-pressed="${x === false}">불가</button></div>`;
        }).join("")}</section>`).join("")}
      <label class="field" style="font-size:15px;font-weight:700">리더에게 전할 말
        <span class="hint">예: 11/15는 오후만 가능해요</span>
        <textarea id="respNote" maxlength="300" style="min-height:80px">${esc(noteRow?.note || "")}</textarea></label>
      <p class="muted small" style="margin:0;text-align:center">누르는 즉시 저장돼요. 마감 전까지 언제든 바꿀 수 있어요.</p>`;

    $("#monthPick")?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { respondMonth = b.dataset.m; renderRespond(); } });

    const refreshProgress = () => {
      const n = $$(".ans-row", v).filter((r) => r.querySelector('[aria-pressed="true"]')).length;
      $("#progLabel").textContent = `${n} / ${slots.length} 응답`;
      $("#progBar").style.width = Math.round(n / slots.length * 100) + "%";
      if (n === slots.length) toast("모든 날짜에 응답했어요");
    };
    async function save(rows) {
      const { error } = await sb.from("availability").upsert(rows.map((r) => ({ member_id: me.id, ...r })));
      if (error) { toast("저장하지 못했어요. 응답이 마감됐는지 확인해 주세요"); renderRespond(); return false; }
      return true;
    }
    v.querySelectorAll(".ans-row").forEach((row) => row.addEventListener("click", async (e) => {
      const b = e.target.closest(".ans"); if (!b) return;
      row.querySelectorAll(".ans").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      if (await save([{ date: row.dataset.date, kind: row.dataset.kind, available: b.dataset.v === "true" }])) refreshProgress();
    }));
    $("#allYes").addEventListener("click", async () => {
      v.querySelectorAll(".ans-row").forEach((row) => row.querySelectorAll(".ans").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === "true"))));
      if (await save(slots.map((s) => ({ date: s.date, kind: s.kind, available: true })))) refreshProgress();
    });
    $("#respNote").addEventListener("change", async (e) => {
      const note = e.target.value.trim();
      const q = note
        ? sb.from("availability_notes").upsert({ member_id: me.id, month: m.month, note })
        : sb.from("availability_notes").delete().eq("member_id", me.id).eq("month", m.month);
      const { error } = await q;
      toast(error ? "저장하지 못했어요" : "리더에게 전할 말을 저장했어요");
    });
  }

  // ---------- 배치표 ----------
  let lineupMonth = null;
  async function renderLineup() {
    const v = $("#view-lineup");
    if (!lineupMonth) lineupMonth = monthOf(todayISO());
    const sundays = sundaysOf(lineupMonth);
    const { data } = await sb.from("published_lineups").select("*")
      .gte("service_date", sundays[0]).lte("service_date", sundays[sundays.length - 1])
      .order("service_date").order("sort_order").order("slot");
    const rows = data || [];
    const dates = [...new Set(rows.map((r) => r.service_date))];
    const role = (r) => r.is_singer_leader ? "싱어 리더" : r.is_band_master ? "밴드 마스터" : "";
    v.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button type="button" class="btn btn-ghost btn-sm" id="prevM" aria-label="이전 달">이전 달</button>
        <h1 style="font-size:22px;font-weight:800">${monthLabel(lineupMonth)} 배치표</h1>
        <button type="button" class="btn btn-ghost btn-sm" id="nextM" aria-label="다음 달">다음 달</button>
      </div>
      ${dates.length ? dates.map((d) => {
        const list = rows.filter((r) => r.service_date === d);
        const mine = list.some((r) => r.member_id === me.id);
        return `<section class="card ${mine ? "bordered" : ""}" style="display:flex;flex-direction:column;gap:6px;${mine ? "border-color:var(--violet-soft)" : ""}">
          <div class="card-head" style="margin-bottom:4px"><h2 class="card-title">${fmtDate(d, { month: "long", day: "numeric" })} 주일</h2>
            <span class="muted small">토요 연습 ${md(addDays(d, -1))}</span></div>
          ${list[0].note ? `<p class="muted small" style="margin:0 0 4px">${esc(list[0].note)}</p>` : ""}
          ${list.map((r) => `<div style="display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;${r.member_id === me.id ? "background:var(--tint);" : ""}">
            <span class="muted small" style="font-weight:600">${esc(r.position_name)}</span>
            <span style="font-weight:${r.member_id === me.id ? 800 : 500};${r.member_id === me.id ? "color:var(--violet)" : ""}">${esc(r.member_name)}${r.member_id === me.id ? " (나)" : ""}</span>
            ${role(r) ? `<span class="chip chip-violet">${role(r)}</span>` : "<span></span>"}</div>`).join("")}
        </section>`;
      }).join("") : `<div class="empty">${monthLabel(lineupMonth)} 확정된 배치표가 아직 없어요.</div>`}`;
    $("#prevM").onclick = () => { lineupMonth = addMonths(lineupMonth, -1); renderLineup(); };
    $("#nextM").onclick = () => { lineupMonth = addMonths(lineupMonth, 1); renderLineup(); };
  }

  // ---------- 내 정보 ----------
  function renderInfo() {
    $("#posInfo").innerHTML = `<dt>주 포지션</dt><dd>${esc(positionName(me.main_position))}</dd>
      ${extras.length ? `<dt>추가 포지션</dt><dd>${extras.map((e) => esc(positionName(e.position_code))).join(", ")}</dd>` : ""}
      <dt>구분</dt><dd>${me.status === "trainee" ? "수습" : "정식 팀원"}</dd>`;
    if (!app) { $("#appCard").classList.add("hidden"); return; }
    $("#appInfo").innerHTML = `<dt>이름</dt><dd>${esc(app.name)}</dd><dt>연락처</dt><dd>${esc(app.phone)}</dd>
      <dt>이메일</dt><dd>${esc(app.email)}</dd><dt>순모임</dt><dd>${esc(app.small_group) || "—"}</dd>
      <dt>지원 포지션</dt><dd>${esc(positionName(app.applied_position))}</dd>
      <dt>지원 동기</dt><dd>${esc(app.motivation) || "—"}</dd><dt>이루고 싶은 것</dt><dd>${esc(app.goal) || "—"}</dd>`;
    $("#pledgeTitle").textContent = app.pledge_title;
    $("#pledge").textContent = app.pledge_content;
    $("#pledgedAt").textContent = `${fmtDate(app.pledged_at, { year: "numeric", month: "long", day: "numeric" })}에 서약했어요.`;
  }
</script>
</body>
</html>
